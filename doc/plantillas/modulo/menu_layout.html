<!--
  PLANTILLA: trozo para templates/layout.html

  COPIAR: dentro de {{define "sidebar"}}, junto a las demás secciones.

  DÓNDE VA: el sidebar de layout.html empieza en la línea 59. Cada sección se
  abre con {{if or (index .Perm "perm_1") (index .Perm "perm_2")}} y se cierra
  con {{end}}. Copia el bloque entero de un módulo existente, cambia los nombres
  y ya está: el formato es idéntico en los 20 módulos.

  POR QUÉ ESTE PASO ES OBLIGATORIO Y NO OPCIONAL
  ----------------------------------------------------
  El layout condiciona CADA sección del menú a (index .Perm "<directory>").
  Sin el permiso en sub_module, la sección no se pinta: no sale el enlace. La
  pantalla existe, responde 200, y el usuario no la ve nunca.

  El `directory` del permiso DEBE COINCIDIR con el nombre de la plantilla que
  el handler renderiza, sin extensión:
      handler renderiza "<MODULO>.html"  ->  directory = "<MODULO>"

  Y el "active" se pone comparando Path1 y Path2 contra las partes de la URL,
  no la URL entera. Path1 = primer segmento, Path2 = segundo. Por eso las
  rutas del módulo se escriben /<MODULO>/algo y no /<algo>.<MODULO>.<id>.

  Este paso más el INSERT IGNORE de schema.sql son la pareja: el permiso aquí,
  la fila en la base. Con los dos, aparece.
-->
        {{if or (index .Perm "<MODULO>") (index .Perm "manage_<MODULO>")}}
        <li class="nav-item">
            <a href="/<MODULO>"><i class="fa fa-fw fa-cube"></i> <span>Módulo</span>
                <span class="arrow"><i class="fa fa-arrow-right"></i></span>
            </a>
            <ul class="nav nav-level2">
                <li {{if and (eq .Path1 "<MODULO>") (eq .Path2 "")}}class="active"{{end}}>
                    <a href="/<MODULO>">Listado</a>
                </li>
                <li {{if and (eq .Path1 "<MODULO>") (eq .Path2 "add")}}class="active"{{end}}>
                    <a href="/<MODULO>/add">Nuevo</a>
                </li>
            </ul>
        </li>
        {{end}}
