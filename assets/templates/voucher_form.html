{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>{{.Title}}</h4></div>
    </div>
    <div class="panel-body">
        <form id="voucherForm">
            <div class="row">
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" class="form-control" name="VDate" value="{{today}}" required>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Referencia</label>
                        <input type="text" class="form-control" name="referenceNo" placeholder="Opcional">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Narración</label>
                        <input type="text" class="form-control" name="Narration" placeholder="Descripción del comprobante">
                    </div>
                </div>
            </div>

            <table class="table table-striped table-bordered" id="rowsTable">
                <thead>
                    <tr>
                        <th style="width:35%">Cuenta</th>
                        <th style="width:25%">Contrapartida</th>
                        <th class="text-right">Débito</th>
                        <th class="text-right">Crédito</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="vrows">
                </tbody>
                <tfoot>
                    <tr>
                        <th colspan="2" class="text-right">Totales</th>
                        <th class="text-right" id="sumDebit">0.00</th>
                        <th class="text-right" id="sumCredit">0.00</th>
                        <th></th>
                    </tr>
                </tfoot>
            </table>

            <button type="button" class="btn btn-default" id="addRow"><i class="fa fa-plus"></i> Añadir línea</button>
            <button type="submit" name="action" value="save" class="btn btn-primary pull-right">Guardar</button>
            <button type="submit" name="action" value="save_exit" class="btn btn-default">Guardar y Salir</button>
            <div id="balanceMsg" class="pull-right" style="margin-right:15px;padding-top:7px"></div>
        </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
var heads = [];
$.getJSON('/account/heads', function (d) { heads = d; });
var rowIdx = 0;

function headOptions(name, sel) {
    var h = '<select class="form-control headsel" name="' + name + '"><option value="">-- Cuenta --</option>';
    heads.forEach(function (x) {
        h += '<option value="' + x.id + '"' + (sel == x.id ? ' selected' : '') + '>' + x.id + ' - ' + x.name + ' (' + x.type + ')</option>';
    });
    return h + '</select>';
}
function addVRow() {
    var i = rowIdx++;
    $('#vrows').append(
        '<tr>' +
        '<td>' + headOptions('COAID') + '</td>' +
        '<td>' + headOptions('RevCodde') + '</td>' +
        '<td><input type="number" step="0.01" min="0" class="form-control text-right amt-debit" name="Debit" placeholder="0.00"></td>' +
        '<td><input type="number" step="0.01" min="0" class="form-control text-right amt-credit" name="Credit" placeholder="0.00"></td>' +
        '<td><button type="button" class="btn btn-danger btn-xs del-row"><i class="fa fa-times"></i></button></td>' +
        '</tr>');
    recalc();
}
function recalc() {
    var sd = 0, sc = 0;
    $('#vrows .amt-debit').each(function () { sd += parseFloat($(this).val()) || 0; });
    $('#vrows .amt-credit').each(function () { sc += parseFloat($(this).val()) || 0; });
    $('#sumDebit').text(sd.toFixed(2));
    $('#sumCredit').text(sc.toFixed(2));
    if (sd === sc && sd > 0) { $('#balanceMsg').html('<span class="label label-success">Cuadrado</span>'); }
    else { $('#balanceMsg').html('<span class="label label-danger">Descuadre: ' + (sd - sc).toFixed(2) + '</span>'); }
}
$(function () {
    var submittedAction = 'save';

    $('button[type=submit]', '#voucherForm').on('click', function () { submittedAction = $(this).val(); });

    addVRow(); addVRow();
    // wait for heads to load then re-render selects
    setTimeout(function () {
        $('#vrows tr').each(function () {
            var sel = $(this).find('select');
            sel.eq(0).replaceWith(headOptions('COAID'));
            sel.eq(1).replaceWith(headOptions('RevCodde'));
        });
    }, 600);

    $('#addRow').on('click', addVRow);
    $('#vrows').on('click', '.del-row', function () { $(this).closest('tr').remove(); recalc(); });
    $('#vrows').on('input change', '.amt-debit, .amt-credit', recalc);

    $('#voucherForm').on('submit', function (e) {
        e.preventDefault();
        var data = $(this).serialize();
        $.post('/account/voucher/save', data, function (r) {
            if (r.status == 1) {
                toastr.success(r.msg + ' (' + r.vno + ')');
                if (submittedAction === 'save_exit') setTimeout(function () { location.href = '/account/vouchers'; }, 900);
            } else toastr.error(r.error || 'Error');
        }).fail(function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); });
    });
});
</script>
{{end}}
