{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title">
            <h4>{{.Title}} <a href="/customer/add" class="btn btn-primary btn-sm pull-right"><i class="fa fa-plus"></i> Añadir Cliente</a></h4>
        </div>
    </div>
    <div class="panel-body">
        <table class="table table-striped table-bordered" id="customerTable" width="100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Móvil</th>
                    <th>Email</th>
                    <th>Dirección</th>
                    <th>Ciudad</th>
                    <th class="text-right">Balance</th>
                    <th>Acciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    var mode = '{{.Mode}}'; // 'credit' => balance > 0 | 'paid' => balance <= 0

    // Filtro client-side (registrado ANTES de inicializar la tabla): solo
    // filas del modo actual, sin re-pedir al servidor.
    $.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {
        var bal = parseFloat(data[6]) || 0;
        return mode === 'credit' ? bal > 0 : bal <= 0;
    });

    var table = $('#customerTable').DataTable({
        processing: true,
        ajax: { url: '/customer/list/data', type: 'GET' },
        columns: [
            { data: 'id' },
            { data: 'name' },
            { data: 'mobile' },
            { data: 'email' },
            { data: 'address' },
            { data: 'city' },
            { data: 'balance', className: 'text-right', render: function (d, t) {
                var v = parseFloat(d) || 0;
                if (t === 'display') return v > 0 ? '<span class="text-danger">' + v.toFixed(2) + '</span>' : v.toFixed(2);
                return v;
            }},
            { data: null, orderable: false, render: function (d) {
                return '<a class="btn btn-info btn-xs" href="/customer/edit/' + d.id + '" title="Editar"><i class="fa fa-pencil"></i></a> ' +
                    '<button class="btn btn-danger btn-xs do-del" data-id="' + d.id + '" title="Eliminar"><i class="fa fa-trash"></i></button> ' +
                    '<a class="btn btn-success btn-xs" href="/customer/ledger/' + d.id + '" title="Libro Mayor"><i class="fa fa-book"></i></a>';
            }}
        ]
    });

    $('#customerTable').on('click', '.do-del', function () {
        var id = $(this).data('id');
        swal({
            title: "¿Eliminar cliente?",
            text: "Esta acción no se puede deshacer.",
            type: "warning",
            showCancelButton: true,
            confirmButtonText: "Eliminar",
            confirmButtonColor: ERPGo.appearance.css("--erp-danger", "#9c3333"),
            closeOnConfirm: true
        }, function () {
            $.post('/customer/delete/' + id, function (r) {
                if (r.status == 1) { toastr.success(r.msg); table.ajax.reload(); }
                else toastr.error(r.error || 'Error');
            }).fail(function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); });
        });
    });
});
</script>
{{end}}
