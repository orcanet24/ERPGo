<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cotización #{{.QNo}}</title>
<style>
body { font-family: Arial, sans-serif; font-size: 12px; margin: 20px; }
table { border-collapse: collapse; width: 100%; margin: 10px 0; }
th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
th { background: #f4f4f4; }
.header { margin-bottom: 20px; }
.pull-right { float: right; }
.text-right { text-align: right; }
@media print { .no-print { display: none; } }
</style>
</head>
<body>
<div class="header">
    <h2>Cotización: {{.QNo}}</h2>
    <p><strong>Fecha:</strong> {{.Date}} &nbsp; <strong>Vence:</strong> {{.Expire}}</p>
    <p><strong>Cliente:</strong> {{.Customer}}</p>
    <p><strong>Notas:</strong> {{.Description}}</p>
</div>

<h4>Totales</h4>
<table>
    <tr><th>Total Productos</th><td class="text-right">{{.ItemTotal}}</td></tr>
    <tr><th>Total Servicios</th><td class="text-right">{{.ServTotal}}</td></tr>
    <tr><th><strong>Total General</strong></th><td class="text-right"><strong>{{.ItemTotal}}</strong></td></tr>
</table>

<div class="no-print" style="margin-top:20px;">
    <button onclick="window.print()">Imprimir</button>
    <button onclick="window.close()">Cerrar</button>
</div>
</body>
</html>
