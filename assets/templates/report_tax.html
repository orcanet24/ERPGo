{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>{{.Title}}</h4></div>
    </div>
    <div class="panel-body">
        <form method="get" class="form-inline" style="margin-bottom:15px">
            <div class="form-group">
                <label>Desde </label>
                <input type="date" class="form-control" name="from" value="{{.From}}">
            </div>
            <div class="form-group" style="margin-left:5px">
                <label>Hasta </label>
                <input type="date" class="form-control" name="to" value="{{.To}}">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-left:5px"><i class="fa fa-search"></i> Consultar</button>
            <button type="button" class="btn btn-default" onclick="window.print()"><i class="fa fa-print"></i> Imprimir</button>
        </form>

        <div class="print-area">
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Fecha</th><th>Factura</th><th>Cliente</th>
                    <th class="text-right">IVA</th><th class="text-right">Otros Impuestos</th>
                </tr>
            </thead>
            <tbody>
            {{range .Rows}}
                <tr>
                    <td>{{.Date}}</td>
                    <td><a href="/invoice/details/{{.Invoice}}">#{{.Invoice}}</a></td>
                    <td>{{.Customer}}</td>
                    <td class="text-right">{{money .Vat}}</td>
                    <td class="text-right">{{money .Tax}}</td>
                </tr>
            {{else}}
                <tr><td colspan="5" class="text-center">Sin datos</td></tr>
            {{end}}
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="3" class="text-right">TOTALES</th>
                    <th class="text-right">{{money .TotalVat}}</th>
                    <th class="text-right">{{money .TotalTax}}</th>
                </tr>
            </tfoot>
        </table>
        </div>
    </div>
</div>
{{end}}

{{define "pagejs"}}{{end}}
