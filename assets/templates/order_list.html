{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title">
            <h4>Pedidos
                <a href="/order/add" class="btn btn-primary btn-sm pull-right"><i class="fa fa-plus"></i> Nuevo Pedido</a>
            </h4>
        </div>
    </div>
    <div class="panel-body">
        <table class="table table-striped table-bordered" id="orderTable" width="100%">
            <thead>
                <tr>
                    <th>Pedido #</th>
                    <th>Cliente</th>
                    <th>Estado</th>
                    <th>Fecha</th>
                    <th>Notas</th>
                    <th>Acciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    var table = $('#orderTable').DataTable({
        processing: true,
        serverSide: true,
        pageLength: 25,
        ajax: { url: '/order/data', type: 'POST' },
        columns: [
            { data: 'order_no' },
            { data: 'customer_name' },
            { data: 'status', render: function (d) {
                var labels = { draft: 'Borrador', confirmed: 'Confirmado', cancelled: 'Cancelado', invoiced: 'Facturado' };
                return '<span class="label label-info">' + (labels[d] || d) + '</span>';
            }},
            { data: 'date' },
            { data: 'notes' },
            { data: null, orderable: false, searchable: false, render: function (d) {
                var btns = '<a class="btn btn-info btn-xs" href="/order/details/' + d.id + '" title="Detalle"><i class="fa fa-eye"></i></a> ';
                if (d.status === 'draft') {
                    btns += '<a class="btn btn-warning btn-xs" href="/order/edit/' + d.id + '" title="Editar"><i class="fa fa-pencil"></i></a> ';
                    btns += '<button class="btn btn-success btn-xs do-confirm" data-id="' + d.id + '" title="Confirmar"><i class="fa fa-check"></i></button> ';
                    btns += '<button class="btn btn-danger btn-xs do-cancel" data-id="' + d.id + '" title="Cancelar"><i class="fa fa-times"></i></button>';
                }
                return btns;
            }}
        ]
    });

    $('#orderTable').on('click', '.do-confirm', function () {
        var id = $(this).data('id');
        swal({
            title: "¿Confirmar pedido?",
            text: "Se reservará el stock correspondiente.",
            type: "warning",
            showCancelButton: true,
            confirmButtonText: "Confirmar",
            confirmButtonColor: ERPGo.appearance.css("--erp-success", "#2e7d32"),
            closeOnConfirm: true
        }, function () {
            $.post('/order/confirm/' + id, function (r) {
                if (r.status == 1) { toastr.success(r.msg); table.ajax.reload(); }
                else toastr.error(r.error || 'Error');
            }).fail(function (x) {
                toastr.error(x.responseJSON ? x.responseJSON.error : 'Error');
            });
        });
    });

    $('#orderTable').on('click', '.do-cancel', function () {
        var id = $(this).data('id');
        swal({
            title: "¿Cancelar pedido?",
            text: "Las reservas asociadas se cancelarán.",
            type: "warning",
            showCancelButton: true,
            confirmButtonText: "Cancelar",
            confirmButtonColor: ERPGo.appearance.css("--erp-danger", "#9c3333"),
            closeOnConfirm: true
        }, function () {
            $.post('/order/cancel/' + id, function (r) {
                if (r.status == 1) { toastr.success(r.msg); table.ajax.reload(); }
                else toastr.error(r.error || 'Error');
            }).fail(function (x) {
                toastr.error(x.responseJSON ? x.responseJSON.error : 'Error');
            });
        });
    });
});
</script>
{{end}}
