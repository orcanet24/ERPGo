{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title">
            <h4>Descuentos por Cliente
                <a href="/product_price/discount/form" class="btn btn-primary btn-sm pull-right"><i class="fa fa-plus"></i> Nuevo Descuento</a>
            </h4>
        </div>
    </div>
    <div class="panel-body">
        <table class="table table-striped table-bordered" id="discountTable" width="100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Cliente</th>
                    <th>Clase</th>
                    <th>Lista</th>
                    <th class="text-right">Desc. %</th>
                    <th class="text-right">Cant. Mín.</th>
                    <th>Vigencia</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    var table = $('#discountTable').DataTable({
        processing: true,
        serverSide: true,
        pageLength: 25,
        ajax: { url: '/product_price/discount/data', type: 'POST' },
        columns: [
            { data: 'id' },
            { data: 'product_name' },
            { data: 'customer_name' },
            { data: 'customer_class' },
            { data: 'price_list_id', render: function (d) {
                var labels = { 1: 'Detalle', 2: 'Mayor', 3: 'Gran Mayor' };
                return labels[d] || d || '-';
            }},
            { data: 'discount_pct', className: 'text-right', render: function (d) {
                return '<span class="label label-warning">' + (parseFloat(d) || 0).toFixed(1) + '%</span>';
            }},
            { data: 'min_qty', className: 'text-right' },
            { data: null, render: function (d) {
                return (d.valid_from || '-') + ' → ' + (d.valid_until || '-');
            }},
            { data: 'status' },
            { data: null, orderable: false, searchable: false, render: function (d) {
                return '<a class="btn btn-warning btn-xs" href="/product_price/discount/form?id=' + d.id + '" title="Editar"><i class="fa fa-pencil"></i></a> ' +
                    '<button class="btn btn-danger btn-xs do-del" data-id="' + d.id + '" title="Eliminar"><i class="fa fa-trash"></i></button>';
            }}
        ]
    });

    $('#discountTable').on('click', '.do-del', function () {
        var id = $(this).data('id');
        swal({
            title: "¿Eliminar descuento?",
            text: "Esta acción no se puede deshacer.",
            type: "warning",
            showCancelButton: true,
            confirmButtonText: "Eliminar",
            confirmButtonColor: ERPGo.appearance.css("--erp-danger", "#9c3333"),
            closeOnConfirm: true
        }, function () {
            $.post('/product_price/discount/delete/' + id, function (r) {
                if (r.status == 1) { toastr.success(r.msg); table.ajax.reload(); }
                else toastr.error(r.error || 'Error');
            }).fail(function (x) {
                toastr.error(x.responseJSON ? x.responseJSON.error : 'Error');
            });
        });
    });
});
</script>
{{end}}
