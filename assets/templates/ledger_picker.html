{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>{{.Title}}</h4></div>
    </div>
    <div class="panel-body">
        <div class="form-group">
            <div class="input-group">
                <span class="input-group-addon"><i class="fa fa-search"></i></span>
                <input type="text" class="form-control" id="searchBox" placeholder="Buscar por nombre..." autofocus>
            </div>
        </div>
        <table class="table table-striped table-bordered" id="pickerTable">
            <thead>
                <tr>
                    <th style="width:80px">ID</th>
                    <th>Nombre</th>
                    <th style="width:120px" class="text-right">Mayor</th>
                </tr>
            </thead>
            <tbody>
            {{if eq .Kind "customer"}}
                {{range .Customers}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Name}}</td>
                    <td class="text-right"><a class="btn btn-success btn-xs" href="/customer/ledger/{{.ID}}"><i class="fa fa-book"></i> Ver</a></td>
                </tr>
                {{end}}
            {{else if eq .Kind "supplier"}}
                {{range .Suppliers}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Name}}</td>
                    <td class="text-right"><a class="btn btn-success btn-xs" href="/supplier/ledger/{{.ID}}"><i class="fa fa-book"></i> Ver</a></td>
                </tr>
                {{end}}
            {{end}}
            </tbody>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    $('#searchBox').on('keyup', function () {
        var q = $(this).val().toLowerCase().trim();
        $('#pickerTable tbody tr').each(function () {
            var name = $(this).find('td').eq(1).text().toLowerCase();
            $(this).toggle(name.indexOf(q) !== -1);
        });
    });
});
</script>
{{end}}
