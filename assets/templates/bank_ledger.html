{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>Libro Bancario</h4></div>
    </div>
    <div class="panel-body">
        <form class="form-inline" id="ledgerFilter" style="margin-bottom:15px">
            <div class="form-group">
                <select class="form-control select2" id="bankId" name="bank_id" style="width:320px" required>
                    <option value="">-- Seleccione cuenta bancaria --</option>
                    {{range .Banks}}
                    <option value="{{.id}}" {{if eq (printf "%v" .id) (query "bank_id")}}selected{{end}}>{{.name}} {{if .ac}}({{.ac}}){{end}}</option>
                    {{end}}
                </select>
            </div>
            <div class="form-group" style="margin-left:10px">
                <label>Desde</label>
                <input type="date" class="form-control" id="from" name="from" value="{{printf "%.4s" today}}-01-01">
            </div>
            <div class="form-group" style="margin-left:5px">
                <label>Hasta</label>
                <input type="date" class="form-control" id="to" name="to" value="{{today}}">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-left:5px"><i class="fa fa-search"></i> Consultar</button>
            <button type="button" class="btn btn-default" onclick="window.print()"><i class="fa fa-print"></i> Imprimir</button>
        </form>

        <div id="ledgerResult"></div>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
function fmt(n) {
    var v = parseFloat(n) || 0;
    return v.toFixed(2);
}

function typeLabel(t) {
    if (t === 'deposit') return '<span class="label label-success">Depósito</span>';
    if (t === 'withdraw') return '<span class="label label-danger">Retiro</span>';
    if (t === 'transfer') return '<span class="label label-info">Transferencia</span>';
    return t;
}

function loadLedger() {
    var bid = $('#bankId').val();
    if (!bid) return;
    $.getJSON('/bank/ledger/data', { bank_id: bid, from: $('#from').val(), to: $('#to').val() }, function (d) {
        var html = '<div class="print-area">' +
            '<div class="text-center" style="margin-bottom:10px"><h4 style="margin:0">{{.Company.CompanyName}}</h4>' +
            '<small>Libro Bancario — ' + d.bank + (d.ac_number ? ' (' + d.ac_number + ')' : '') + '</small></div>' +
            '<p><strong>Saldo de apertura:</strong> {{.Currency}} ' + d.opening + '</p>' +
            '<table class="table table-striped table-bordered"><thead><tr>' +
            '<th>Fecha</th><th>Tipo</th><th>Referencia</th><th>Descripción</th>' +
            '<th class="text-right">Entrada (Débito)</th><th class="text-right">Salida (Crédito)</th><th class="text-right">Saldo</th>' +
            '</tr></thead><tbody>';
        if (!d.data || !d.data.length) {
            html += '<tr><td colspan="7" class="text-center">Sin movimientos en el período</td></tr>';
        } else {
            d.data.forEach(function (r) {
                html += '<tr><td>' + (r.date || '').split('T')[0] + '</td><td>' + typeLabel(r.type) + '</td>' +
                    '<td>' + r.ref + '</td><td>' + r.description + '</td>' +
                    '<td class="text-right">' + fmt(r.debit) + '</td><td class="text-right">' + fmt(r.credit) + '</td>' +
                    '<td class="text-right">' + fmt(r.balance) + '</td></tr>';
            });
        }
        html += '</tbody><tfoot><tr><th colspan="4">Totales</th>' +
            '<th class="text-right">' + d.total_debit + '</th><th class="text-right">' + d.total_credit + '</th>' +
            '<th class="text-right">Cierre: ' + d.closing + '</th></tr></tfoot></table></div>';
        $('#ledgerResult').html(html);
    }).fail(function (x) {
        toastr.error(x.responseJSON ? x.responseJSON.error : 'Error al cargar el libro bancario');
    });
}

$(function () {
    $('#ledgerFilter').on('submit', function (e) { e.preventDefault(); loadLedger(); });
    $('#bankId').on('change', loadLedger);
    loadLedger();
});
</script>
{{end}}
