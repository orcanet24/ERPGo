{{define "content"}}
<div class="row">
    <div class="col-md-5">
        <div class="panel panel-bd">
            <div class="panel-heading">
                <div class="panel-title"><h4 id="formTitle">Nueva Unidad</h4></div>
            </div>
            <div class="panel-body">
                <form id="unitForm">
                    <input type="hidden" name="unit_id" id="unit_id" value="">
                    <div class="form-group">
                        <label for="unit_name">Nombre de la Unidad <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="unit_name" name="unit_name" required placeholder="Ej: Kilogramo, Caja, Unidad">
                    </div>
                    <button type="submit" name="action" value="save" class="btn btn-primary">Guardar</button>
            <button type="submit" name="action" value="save_exit" class="btn btn-default">Guardar y Salir</button>
            <button type="button" class="btn btn-default" id="btnReset">Limpiar</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-7">
        <div class="panel panel-bd">
            <div class="panel-heading">
                <div class="panel-title"><h4>Unidades de Medida</h4></div>
            </div>
            <div class="panel-body">
                <table class="table table-striped table-bordered" id="unitTable">
                    <thead>
                        <tr>
                            <th style="width:60px">ID</th>
                            <th>Nombre</th>
                            <th class="text-center" style="width:110px">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="unitRows">
                        <tr><td colspan="3" class="text-center">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
function loadUnits() {
    $.getJSON('/product/unit/data', function (d) {
        var rows = '';
        if (!d.length) {
            rows = '<tr><td colspan="3" class="text-center">Sin unidades</td></tr>';
        }
        d.forEach(function (u) {
            rows += '<tr>' +
                '<td>' + u.id + '</td>' +
                '<td>' + escapeHtml(u.name) + '</td>' +
                '<td class="text-center">' +
                    '<button class="btn btn-warning btn-xs do-edit" data-id="' + u.id + '" data-name="' + escapeHtml(u.name) + '" title="Editar"><i class="fa fa-pencil"></i></button> ' +
                    '<button class="btn btn-danger btn-xs do-del" data-id="' + u.id + '" title="Eliminar"><i class="fa fa-trash"></i></button>' +
                '</td></tr>';
        });
        $('#unitRows').html(rows);
    }).fail(function () {
        $('#unitRows').html('<tr><td colspan="3" class="text-center text-danger">Error al cargar</td></tr>');
    });
}
function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function resetForm() {
    $('#unit_id').val('');
    $('#unit_name').val('');
    $('#formTitle').text('Nueva Unidad');
    $('#btnSave').html('<i class="fa fa-save"></i> Guardar');
}
$(function () {
    loadUnits();

    $('#btnReset').on('click', resetForm);

    $('#unitRows').on('click', '.do-edit', function () {
        $('#unit_id').val($(this).data('id'));
        $('#unit_name').val($(this).data('name'));
        $('#formTitle').text('Editar Unidad #' + $(this).data('id'));
        $('#btnSave').html('<i class="fa fa-check"></i> Actualizar');
    });

    $('#unitRows').on('click', '.do-del', function () {
        var id = $(this).data('id');
        swal({
            title: "¿Eliminar unidad?",
            text: "Solo se puede eliminar si no tiene productos asociados.",
            type: "warning",
            showCancelButton: true,
            confirmButtonText: "Eliminar",
            confirmButtonColor: ERPGo.appearance.css("--erp-danger", "#9c3333")
        }, function () {
            $.post('/product/unit/delete/' + id, function (r) {
                if (r.status == 1) { toastr.success(r.msg); loadUnits(); }
                else toastr.error(r.error || 'Error');
            }).fail(function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); });
        });
    });

    $('#unitForm').on('submit', function (e) {
        e.preventDefault();
        $.post('/product/unit/save', $(this).serialize(), function (r) {
            if (r.status == 1) {
                toastr.success(r.msg);
                resetForm();
                loadUnits();
            } else toastr.error(r.error || 'Error');
        }).fail(function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); });
    });
});
</script>
{{end}}
