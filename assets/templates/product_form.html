{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>{{.Title}}</h4></div>
    </div>
    <div class="panel-body">
        <form id="productForm" enctype="multipart/form-data">
            <input type="hidden" name="product_id" value="{{if .P}}{{.P.ID.String}}{{end}}">
            <div class="row">
                <div class="col-md-8">
                    <div class="form-group {{if .P}}has-warning{{end}}">
                        <label for="product_name">Nombre del Producto <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="product_name" name="product_name" required
                               placeholder="Nombre" value="{{if .P}}{{.P.Name.String}}{{end}}">
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="category_id">Categoría</label>
                                <select class="form-control" id="category_id" name="category_id">
                                    <option value="">-- Seleccione --</option>
                                    {{range .Categories}}
                                    <option value="{{.id}}" {{if $.P}}{{if eq $.P.Cat.String (printf "%d" .id)}}selected{{end}}{{end}}>{{.name}}</option>
                                    {{end}}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="unit">Unidad</label>
                                <select class="form-control" id="unit" name="unit">
                                    <option value="">-- Seleccione --</option>
                                    {{range .Units}}
                                    <option value="{{.name}}" {{if $.P}}{{if eq $.P.Unit.String .name}}selected{{end}}{{end}}>{{.name}}</option>
                                    {{end}}
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="price">Precio de Venta</label>
                                <div class="input-group">
                                    <span class="input-group-addon">{{.Currency}}</span>
                                    <input type="number" step="0.01" min="0" class="form-control text-right" id="price" name="price"
                                           placeholder="0.00" value="{{if .P}}{{.P.Price.String}}{{end}}">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="product_model">Modelo</label>
                                <input type="text" class="form-control" id="product_model" name="product_model"
                                       placeholder="Modelo" value="{{if .P}}{{.P.Model.String}}{{end}}">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="barcode">Código de Barras <small class="text-muted">(EAN13/Code128 — se lee en el POS)</small></label>
                                <input type="text" class="form-control" id="barcode" name="barcode"
                                       placeholder="Ej: 7591234567890" value="{{if .P}}{{.P.Barcode.String}}{{end}}">
                            </div>
                        </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="tax">Impuesto (%)</label>
                                <input type="number" step="0.01" min="0" class="form-control" id="tax" name="tax"
                                       placeholder="0.00" value="{{if .P}}{{.P.Tax.String}}{{end}}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="product_vat">IVA (%)</label>
                                <input type="number" step="0.01" min="0" class="form-control" id="product_vat" name="product_vat"
                                       placeholder="0.00" value="{{if .P}}{{.P.Vat.String}}{{end}}">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="serial_no">Número de Serie</label>
                        <input type="text" class="form-control" id="serial_no" name="serial_no"
                               placeholder="111,abc,XYz" value="{{if .P}}{{.P.Serial.String}}{{end}}">
                    </div>
                    <div class="form-group">
                        <label for="product_details">Detalles</label>
                        <textarea class="form-control" id="product_details" name="product_details" rows="3"
                                  placeholder="Descripción del producto">{{if .P}}{{.P.Details.String}}{{end}}</textarea>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="image">Imagen</label>
                        <input type="file" class="form-control" id="image" name="image" accept=".jpg,.jpeg,.png,.gif">
                        <p class="help-block">Formatos permitidos: JPG, PNG, GIF</p>
                    </div>
                    {{if .P}}
                    {{if .P.Image.String}}
                    <div class="form-group">
                        <label>Imagen actual</label><br>
                        <img src="/{{.P.Image.String}}" alt="Imagen del producto" class="img-thumbnail" style="max-width:180px;max-height:150px">
                    </div>
                    {{end}}
                    {{end}}
                </div>
            </div>
            <button type="submit" name="action" value="save" class="btn btn-primary">Guardar</button>
            <button type="submit" name="action" value="save_exit" class="btn btn-default">Guardar y Salir</button>
            <a href="/product/list" class="btn btn-default">Cancelar</a>
        </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    var submittedAction = 'save';

    $('button[type=submit]', '#productForm').on('click', function () { submittedAction = $(this).val(); });

    $('#productForm').on('submit', function (e) {
        e.preventDefault();
        var form = this;
        var fd = new FormData(form);
        $.ajax({
            url: '/product/save',
            type: 'POST',
            data: fd,
            processData: false,
            contentType: false,
            success: function (r) {
                if (r.status == 1) {
                    toastr.success(r.msg);
                    if (submittedAction === 'save_exit') setTimeout(function () { location.href = '/product/list'; }, 800);
                } else {
                    toastr.error(r.error || 'Error');
                }
            },
            error: function (x) {
                toastr.error(x.responseJSON ? x.responseJSON.error : 'Error al guardar');
            }
        });
    });
});
</script>
{{end}}
