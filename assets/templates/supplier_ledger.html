{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>Libro Mayor: {{.SName}}</h4></div>
    </div>
    <div class="panel-body">
        <div class="row" style="margin-bottom:15px">
            <div class="col-md-4">
                <address>
                    <strong>{{.SName}}</strong><br>
                    {{if .SMobile}}<i class="fa fa-mobile"></i> {{.SMobile}}<br>{{end}}
                    {{if .SAddr}}<i class="fa fa-map-marker"></i> {{.SAddr}}{{end}}
                </address>
            </div>
            <div class="col-md-8">
                <form class="form-inline pull-right" id="ledgerFilter">
                    <div class="form-group">
                        <label>Desde</label>
                        <input type="text" class="form-control datepicker" id="from" name="from" placeholder="YYYY-MM-DD" readonly>
                    </div>
                    <div class="form-group">
                        <label>Hasta</label>
                        <input type="text" class="form-control datepicker" id="to" name="to" placeholder="YYYY-MM-DD" readonly>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fa fa-filter"></i> Filtrar</button>
                    <button type="button" class="btn btn-default" id="btnPrint"><i class="fa fa-print"></i> Imprimir</button>
                </form>
            </div>
        </div>

        <div class="print-area">
            <div class="text-center" style="margin-bottom:10px">
                <h4 style="margin:0">{{.Company.CompanyName}}</h4>
                <small>Libro Mayor — {{.SName}}</small>
            </div>
            <table class="table table-striped table-bordered" id="ledgerTable" width="100%">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>VNo</th>
                        <th>Tipo</th>
                        <th>Narración</th>
                        <th class="text-right">Débito</th>
                        <th class="text-right">Crédito</th>
                        <th class="text-right">Balance</th>
                    </tr>
                </thead>
                <tbody></tbody>
                <tfoot>
                    <tr>
                        <th colspan="4" class="text-right">Total</th>
                        <th class="text-right" id="totalDebit">0.00</th>
                        <th class="text-right" id="totalCredit">0.00</th>
                        <th class="text-right" id="totalBalance">0.00</th>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    var url = '/supplier/ledger/{{.SID}}/data';

    $('.datepicker').datepicker({ dateFormat: 'yy-mm-dd' });

    function fmt(n) {
        var v = parseFloat(n) || 0;
        return v.toFixed(2);
    }

    function load(from, to) {
        $.getJSON(url, { from: from || '', to: to || '' }, function (r) {
            var body = $('#ledgerTable tbody').empty();
            if (!r.data || !r.data.length) {
                body.append('<tr><td colspan="7" class="text-center">Sin movimientos</td></tr>');
            } else {
                $.each(r.data, function (i, row) {
                    var date = (row.date || '').split('T')[0];
                    body.append(
                        '<tr>' +
                        '<td>' + date + '</td>' +
                        '<td>' + row.vno + '</td>' +
                        '<td>' + row.vtype + '</td>' +
                        '<td>' + row.narration + '</td>' +
                        '<td class="text-right">' + fmt(row.debit) + '</td>' +
                        '<td class="text-right">' + fmt(row.credit) + '</td>' +
                        '<td class="text-right">' + fmt(row.balance) + '</td>' +
                        '</tr>'
                    );
                });
            }
            $('#totalDebit').text(fmt(r.total_debit));
            $('#totalCredit').text(fmt(r.total_credit));
            $('#totalBalance').text(fmt(r.balance));
        }).fail(function (x) {
            toastr.error(x.responseJSON ? x.responseJSON.error : 'Error al cargar el mayor');
        });
    }

    $('#ledgerFilter').on('submit', function (e) {
        e.preventDefault();
        load($('#from').val(), $('#to').val());
    });

    $('#btnPrint').on('click', function () {
        window.print();
    });

    load('', '');
});
</script>
{{end}}
