{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <h3 class="panel-title">{{.Title}}</h3>
        <div class="btn-group pull-right">
            <a href="/settings" class="btn btn-default btn-sm"><i class="fa fa-arrow-left"></i> Volver</a>
        </div>
    </div>
    <div class="panel-body">
        <div class="row">
            <div class="col-md-5">
                <div class="panel panel-bd">
                    <div class="panel-heading"><h4 class="panel-title">Agregar Tasa</h4></div>
                    <div class="panel-body">
                        <form method="POST" action="/settings/exchange-rate/save">
                            <div class="form-group">
                                <label>Fecha</label>
                                <input type="date" name="date" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Moneda</label>
                                <select name="currency" class="form-control">
                                    <option value="USD">USD - Dólar</option>
                                    <option value="EUR">EUR - Euro</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Tasa BCV</label>
                                <input type="number" step="0.0001" name="rate" class="form-control" required>
                            </div>
                            <button type="submit" name="action" value="save" class="btn btn-success">Guardar</button>
            <button type="submit" name="action" value="save_exit" class="btn btn-default">Guardar y Salir</button>
            </form>
                    </div>
                </div>
            </div>
            <div class="col-md-7">
                <table class="table table-bordered table-striped" id="exRateTable">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Moneda</th>
                            <th>Tasa BCV</th>
                            <th>Fuente</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function() {
    $('#exRateTable').DataTable({
        ajax: '/settings/exchange-rate/data',
        columns: [
            { data: 'date' },
            { data: 'currency' },
            { data: 'rate' },
            { data: 'source' }
        ]
    });
});
</script>
{{end}}
