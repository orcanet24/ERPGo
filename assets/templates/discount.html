{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <h3 class="panel-title">{{.Title}}</h3>
        <div class="btn-group pull-right">
            <a href="/product_price/discount/list" class="btn btn-default btn-sm"><i class="fa fa-arrow-left"></i> Volver</a>
        </div>
    </div>
    <div class="panel-body">
        <form method="POST" action="/product_price/discount/save" id="discountForm">
            <input type="hidden" name="id" value="{{.DiscountID}}">
            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Producto *</label>
                        <select name="product_id" class="form-control" required>
                            <option value="">Seleccione...</option>
                            {{range .Products}}
                            <option value="{{.id}}" {{with $.DiscountProductID}}{{if eq $.DiscountProductID .id}}selected{{end}}{{end}}>{{.name}}</option>
                            {{end}}
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Cliente (opcional)</label>
                        <select name="customer_id" class="form-control">
                            <option value="">TODOS</option>
                            {{range .Customers}}
                            <option value="{{.id}}" {{with $.DiscountCustomerID}}{{if eq $.DiscountCustomerID .id}}selected{{end}}{{end}}>{{.name}}</option>
                            {{end}}
                        </select>
                        <small class="text-muted">Si se omite, aplica a todos los clientes de la clase indicada</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Clase de Cliente (opcional)</label>
                        <select name="customer_class" class="form-control">
                            <option value="">Sin clase específica</option>
                            <option value="minorista" {{with $.DiscountClass}}{{if eq . "minorista"}}selected{{end}}{{end}}>Minorista</option>
                            <option value="mayorista" {{with $.DiscountClass}}{{if eq . "mayorista"}}selected{{end}}{{end}}>Mayorista</option>
                            <option value="distribuidor" {{with $.DiscountClass}}{{if eq . "distribuidor"}}selected{{end}}{{end}}>Distribuidor</option>
                            <option value="vip" {{with $.DiscountClass}}{{if eq . "vip"}}selected{{end}}{{end}}>VIP</option>
                            <option value="empleado" {{with $.DiscountClass}}{{if eq . "empleado"}}selected{{end}}{{end}}>Empleado</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Lista de Precio</label>
                        <select name="price_list_id" class="form-control">
                            <option value="">Cualquiera</option>
                            <option value="1" {{with $.DiscountPriceList}}{{if eq . 1}}selected{{end}}{{end}}>Detalle</option>
                            <option value="2" {{with $.DiscountPriceList}}{{if eq . 2}}selected{{end}}{{end}}>Mayor</option>
                            <option value="3" {{with $.DiscountPriceList}}{{if eq . 3}}selected{{end}}{{end}}>Gran Mayor</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Descuento (%) *</label>
                        <input type="number" step="0.01" min="0" max="100" name="discount_pct" class="form-control" placeholder="0.00" required
                               value="{{.DiscountPct}}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Cantidad Mínima</label>
                        <input type="number" step="0.01" min="0" name="min_qty" class="form-control" placeholder="0" value="{{.MinQty}}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="status" class="form-control">
                            <option value="active" {{with $.DiscountStatus}}{{if eq . "active"}}selected{{end}}{{end}}>Activo</option>
                            <option value="inactive" {{with $.DiscountStatus}}{{if eq . "inactive"}}selected{{end}}{{end}}>Inactivo</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Válido Desde</label>
                        <input type="date" name="valid_from" class="form-control" value="{{.ValidFrom}}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Válido Hasta</label>
                        <input type="date" name="valid_until" class="form-control" value="{{.ValidUntil}}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Motivo / Razón</label>
                        <input type="text" name="reason" class="form-control" placeholder="Ej: Promoción especial mayoristas" value="{{.Reason}}">
                    </div>
                </div>
            </div>
            <hr>
            <div class="alert alert-info">
                <strong>Prioridad de búsqueda:</strong> Cliente específico → Clase de cliente → Producto+Lista genérico
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/product_price/discount/list" class="btn btn-default">Cancelar</a>
        </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    $('#discountForm').on('submit', function (e) {
        e.preventDefault();
        var pct = parseFloat($('[name="discount_pct"]').val()) || 0;
        if (pct < 0 || pct > 100) {
            toastr.error('El descuento debe ser entre 0 y 100');
            return;
        }
        $.post('/product_price/discount/save', $(this).serialize(), function (r) {
            if (r.status == 1) {
                toastr.success(r.msg);
                setTimeout(function () { location.href = '/product_price/discount/list'; }, 800);
            } else {
                toastr.error(r.error || 'Error al guardar');
            }
        }).fail(function (x) {
            toastr.error(x.responseJSON ? x.responseJSON.error : 'Error');
        });
    });
});
</script>
{{end}}
