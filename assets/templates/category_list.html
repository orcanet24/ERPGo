{{define "content"}}
<div class="row">
    <div class="col-md-5">
        <div class="panel panel-bd">
            <div class="panel-heading">
                <div class="panel-title"><h4 id="formTitle">Nueva Categoría</h4></div>
            </div>
            <div class="panel-body">
                <form id="categoryForm">
                    <input type="hidden" name="category_id" id="category_id" value="">
                    <div class="form-group">
                        <label for="category_name">Nombre de la Categoría <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="category_name" name="category_name" required placeholder="Ej: Bebidas">
                    </div>
                    <button type="submit" name="action" value="save" class="btn btn-primary">Guardar</button>
            <button type="submit" name="action" value="save_exit" class="btn btn-default">Guardar y Salir</button>
            <button type="button" class="btn btn-default" id="btnReset">Limpiar</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-7">
        <div class="panel panel-bd">
            <div class="panel-heading">
                <div class="panel-title"><h4>Categorías</h4></div>
            </div>
            <div class="panel-body">
                <table class="table table-striped table-bordered" id="categoryTable">
                    <thead>
                        <tr>
                            <th style="width:60px">ID</th>
                            <th>Nombre</th>
                            <th class="text-right" style="width:90px">Productos</th>
                            <th class="text-center" style="width:110px">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="categoryRows">
                        <tr><td colspan="4" class="text-center">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
function loadCategories() {
    $.getJSON('/product/category/data', function (d) {
        var rows = '';
        if (!d.length) {
            rows = '<tr><td colspan="4" class="text-center">Sin categorías</td></tr>';
        }
        d.forEach(function (c) {
            rows += '<tr>' +
                '<td>' + c.id + '</td>' +
                '<td>' + escapeHtml(c.name) + '</td>' +
                '<td class="text-right">' + c.products + '</td>' +
                '<td class="text-center">' +
                    '<button class="btn btn-warning btn-xs do-edit" data-id="' + c.id + '" data-name="' + escapeHtml(c.name) + '" title="Editar"><i class="fa fa-pencil"></i></button> ' +
                    '<button class="btn btn-danger btn-xs do-del" data-id="' + c.id + '" title="Eliminar"><i class="fa fa-trash"></i></button>' +
                '</td></tr>';
        });
        $('#categoryRows').html(rows);
    }).fail(function () {
        $('#categoryRows').html('<tr><td colspan="4" class="text-center text-danger">Error al cargar</td></tr>');
    });
}
function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function resetForm() {
    $('#category_id').val('');
    $('#category_name').val('');
    $('#formTitle').text('Nueva Categoría');
    $('#btnSave').html('<i class="fa fa-save"></i> Guardar');
}
$(function () {
    loadCategories();

    $('#btnReset').on('click', resetForm);

    $('#categoryRows').on('click', '.do-edit', function () {
        $('#category_id').val($(this).data('id'));
        $('#category_name').val($(this).data('name'));
        $('#formTitle').text('Editar Categoría #' + $(this).data('id'));
        $('#btnSave').html('<i class="fa fa-check"></i> Actualizar');
    });

    $('#categoryRows').on('click', '.do-del', function () {
        var id = $(this).data('id');
        swal({
            title: "¿Eliminar categoría?",
            text: "Solo se puede eliminar si no tiene productos.",
            type: "warning",
            showCancelButton: true,
            confirmButtonText: "Eliminar",
            confirmButtonColor: ERPGo.appearance.css("--erp-danger", "#9c3333")
        }, function () {
            $.post('/product/category/delete/' + id, function (r) {
                if (r.status == 1) { toastr.success(r.msg); loadCategories(); }
                else toastr.error(r.error || 'Error');
            }).fail(function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); });
        });
    });

    $('#categoryForm').on('submit', function (e) {
        e.preventDefault();
        $.post('/product/category/save', $(this).serialize(), function (r) {
            if (r.status == 1) {
                toastr.success(r.msg);
                resetForm();
                loadCategories();
            } else toastr.error(r.error || 'Error');
        }).fail(function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); });
    });
});
</script>
{{end}}
