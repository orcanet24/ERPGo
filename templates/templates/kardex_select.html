{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <h3 class="panel-title">{{.Title}}</h3>
    </div>
    <div class="panel-body">
        <form method="GET" action="/reports/kardex" class="form-inline">
            <div class="form-group">
                <label>Producto:</label>
                <select name="product_id" id="productSel" class="form-control" style="width:350px" required></select>
            </div>
            <div class="form-group">
                <label>Desde:</label>
                <input type="date" name="from" class="form-control" value="{{.From}}">
            </div>
            <div class="form-group">
                <label>Hasta:</label>
                <input type="date" name="to" class="form-control" value="{{.To}}">
            </div>
            <button type="submit" class="btn btn-primary"><i class="fa fa-search"></i> Ver Kárdex</button>
        </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function() {
    $('#productSel').select2({
        placeholder: 'Buscar producto...',
        ajax: {
            url: '/reports/kardex/products',
            dataType: 'json',
            delay: 300,
            data: function(p) { return { term: p.term }; },
            processResults: function(d) { return { results: d.map(function(x) { return { id: x.id, text: x.label }; }) }; }
        }
    });
});
</script>
{{end}}
