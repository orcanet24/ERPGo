{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title">
            <h4>Comprobantes
                <span class="btn-group pull-right">
                    <a href="/account/voucher/new?type=DV" class="btn btn-primary btn-sm">+ Débito (DV)</a>
                    <a href="/account/voucher/new?type=CV" class="btn btn-primary btn-sm">+ Crédito (CV)</a>
                    <a href="/account/voucher/new?type=CONTRA" class="btn btn-primary btn-sm">+ Contra</a>
                    <a href="/account/voucher/new?type=JV" class="btn btn-primary btn-sm">+ Diario (JV)</a>
                </span>
            </h4>
        </div>
    </div>
    <div class="panel-body">
        <div class="form-group" style="max-width:250px">
            <select id="vtypeFilter" class="form-control">
                <option value="">Todos los tipos</option>
                <option value="DV">Débito (DV)</option>
                <option value="CV">Crédito (CV)</option>
                <option value="CONTRA">Contra</option>
                <option value="JV">Diario (JV)</option>
            </select>
        </div>
        <table class="table table-striped table-bordered" id="voucherTable" width="100%">
            <thead>
                <tr>
                    <th>VNo</th><th>Tipo</th><th>Fecha</th><th>Referencia</th><th>Narración</th>
                    <th class="text-right">Débito</th><th class="text-right">Crédito</th><th>Estado</th><th>Acciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
var table;
$(function () {
    table = $('#voucherTable').DataTable({
        serverSide: true,
        processing: true,
        ajax: {
            url: '/account/vouchers/data',
            type: 'POST',
            data: function (d) { d.vtype = $('#vtypeFilter').val(); }
        },
        columns: [
            { data: 'vno' },
            { data: 'vtype' },
            { data: 'date' },
            { data: 'ref' },
            { data: 'narration' },
            { data: 'debit', className: 'text-right' },
            { data: 'credit', className: 'text-right' },
            {
                data: 'approved', render: function (d) {
                    return d == 1 ? '<span class="label label-success">Aprobado</span>' : '<span class="label label-warning">Pendiente</span>';
                }
            },
            {
                data: null, orderable: false, render: function (d) {
                    var btns = '';
                    if (d.approved != 1) btns += '<button class="btn btn-success btn-xs do-approve" data-vno="' + d.vno + '"><i class="fa fa-check"></i></button> ';
                    else btns += '<button class="btn btn-warning btn-xs do-reverse" data-vno="' + d.vno + '"><i class="fa fa-undo"></i></button> ';
                    if (d.approved != 1) btns += '<button class="btn btn-danger btn-xs do-delete" data-vno="' + d.vno + '"><i class="fa fa-trash"></i></button>';
                    return btns;
                }
            }
        ]
    });
    $('#vtypeFilter').on('change', function () { table.ajax.reload(); });

    $('#voucherTable').on('click', '.do-approve', function () {
        var vno = $(this).data('vno');
        swal({ title: "¿Aprobar " + vno + "?", type: "warning", showCancelButton: true, confirmButtonText: "Aprobar" },
            function () {
                $.post('/account/voucher/approve/' + vno, function (r) {
                    if (r.status == 1) { toastr.success(r.msg); table.ajax.reload(); } else toastr.error(r.error);
                });
            });
    });
    $('#voucherTable').on('click', '.do-reverse', function () {
        var vno = $(this).data('vno');
        swal({ title: "¿Revertir " + vno + "?", text: "Se eliminarán las transacciones contables", type: "warning", showCancelButton: true, confirmButtonText: "Revertir", confirmButtonColor: ERPGo.appearance.css("--erp-danger", "#9c3333") },
            function () {
                $.post('/account/voucher/reverse/' + vno, function (r) {
                    if (r.status == 1) { toastr.success(r.msg); table.ajax.reload(); } else toastr.error(r.error);
                });
            });
    });
    $('#voucherTable').on('click', '.do-delete', function () {
        var vno = $(this).data('vno');
        swal({ title: "¿Eliminar " + vno + "?", type: "error", showCancelButton: true, confirmButtonText: "Eliminar", confirmButtonColor: ERPGo.appearance.css("--erp-danger", "#9c3333") },
            function () {
                $.post('/account/voucher/delete/' + vno, function (r) {
                    if (r.status == 1) { toastr.success(r.msg); table.ajax.reload(); } else toastr.error(r.error);
                });
            });
    });
});
</script>
{{end}}
