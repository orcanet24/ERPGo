{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <h3 class="panel-title">{{.Title}}</h3>
        <div class="btn-group pull-right">
            <a href="/service/list" class="btn btn-default btn-sm"><i class="fa fa-arrow-left"></i> Volver</a>
        </div>
    </div>
    <div class="panel-body">
        <form method="POST" action="/service/save">
            <input type="hidden" name="service_id" value="{{with .S}}{{.id}}{{end}}">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Nombre del Servicio *</label>
                        <input type="text" name="service_name" class="form-control" required
                               value="{{with .S}}{{.name}}{{end}}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Cargo *</label>
                        <input type="number" name="charge" step="0.01" min="0" class="form-control" required
                               value="{{with .S}}{{.charge}}{{end}}">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>VAT (%)</label>
                        <input type="number" name="service_vat" step="0.01" min="0" class="form-control"
                               value="{{with .S}}{{.vat}}{{end}}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Tipo</label><br>
                        <input type="checkbox" name="is_fixed" value="1" {{with .S}}{{if eq .is_fixed 1}}checked{{end}}{{end}}> Monto Fijo
                        &nbsp;
                        <input type="checkbox" name="is_dynamic" value="1" {{with .S}}{{if eq .is_dynamic 1}}checked{{end}}{{end}}> Monto Dinámico
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea name="description" class="form-control" rows="3">{{with .S}}{{.description}}{{end}}</textarea>
            </div>
            <button type="submit" name="action" value="save" class="btn btn-primary">Guardar</button>
            <button type="submit" name="action" value="save_exit" class="btn btn-default">Guardar y Salir</button>
            </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
{{end}}
