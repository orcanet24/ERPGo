{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>Roles <button class="btn btn-primary btn-sm pull-right" data-toggle="modal" data-target="#roleModal" onclick="newRole()">+ Añadir Rol</button></h4></div>
    </div>
    <div class="panel-body">
        <table class="table table-striped table-bordered" id="roleTable" width="100%">
            <thead>
                <tr><th>ID</th><th>Rol</th><th>Nivel</th><th>Usuarios</th><th>Acciones</th></tr>
            </thead>
        </table>
    </div>
</div>

<div class="modal fade" id="roleModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form id="roleForm">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                    <h4 class="modal-title">Rol</h4>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="role_id">
                    <div class="form-group">
                        <label>Nombre del rol *</label>
                        <input type="text" class="form-control" name="type" id="role_type" required>
                    </div>
                    <div class="form-group">
                        <label>Nivel *</label>
                        <select class="form-control" name="level" id="role_level">
                            <option value="master">Master</option>
                            <option value="admin">Admin</option>
                            <option value="manager">Manager</option>
                            <option value="employee" selected>Employee</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
                    <button type="submit" name="action" value="save" class="btn btn-primary">Guardar</button>
                    <button type="submit" name="action" value="save_exit" class="btn btn-default">Guardar y Salir</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
function newRole() { $('#roleForm')[0].reset(); $('#role_id').val(''); $('#role_level').val('employee'); }
function editRole(id, type, level) {
    $('#roleForm')[0].reset();
    $('#role_id').val(id);
    $('#role_type').val(type);
    $('#role_level').val(level);
    $('#roleModal').modal('show');
}
function deleteRole(id, type) {
    if (!confirm('¿Estás seguro de eliminar el rol "' + type + '"?')) return;
    $.post('/role/delete/' + id, function (r) {
        if (r.status == 1) { toastr.success(r.msg); $('#roleTable').DataTable().ajax.reload(); }
        else toastr.error(r.error || r.msg);
    }).fail(function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); });
}
$(function () {
    var table = $('#roleTable').DataTable({
        processing: true,
        ajax: {
            url: '/role/list/data',
            type: 'GET',
            dataSrc: ''
        },
        columns: [
            { data: 'id' },
            { data: 'type' },
            { data: 'level' },
            { data: 'users', className: 'text-right' },
            { data: null, orderable: false, render: function (d) {
                return '<a class="btn btn-primary btn-xs" href="/role/permissions/' + d.id + '"><i class="fa fa-key"></i> Permisos</a> ' +
                       '<button class="btn btn-warning btn-xs" onclick="editRole(' + d.id + ', \'' + d.type + '\', \'' + d.level + '\')"><i class="fa fa-edit"></i> Editar</button> ' +
                       '<button class="btn btn-danger btn-xs" onclick="deleteRole(' + d.id + ', \'' + d.type + '\')"><i class="fa fa-trash"></i> Borrar</button>';
            }}
        ]
    });
    $('#roleForm').on('submit', function (e) {
        e.preventDefault();
        $.post('/role/save', $(this).serialize(), function (r) {
            if (r.status == 1) { toastr.success(r.msg); $('#roleModal').modal('hide'); table.ajax.reload(); }
            else toastr.error(r.error);
        });
    });
});
</script>
{{end}}
