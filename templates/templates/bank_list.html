{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title">
            <h4>Cuentas Bancarias
                <a href="/bank/add" class="btn btn-primary btn-sm pull-right"><i class="fa fa-plus"></i> Añadir Cuenta</a>
            </h4>
        </div>
    </div>
    <div class="panel-body">
        <table class="table table-striped table-bordered" id="bankTable" width="100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Banco</th>
                    <th>Titular</th>
                    <th>N° Cuenta</th>
                    <th>Sucursal</th>
                    <th class="text-right">Saldo Inicial</th>
                    <th class="text-right">Saldo Actual</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    var table = $('#bankTable').DataTable({
        processing: true,
        serverSide: true,
        ajax: { url: '/bank/list/data', type: 'GET' },
        columns: [
            { data: 'bank_id' },
            { data: 'name' },
            { data: 'ac_name' },
            { data: 'ac_number' },
            { data: 'branch' },
            { data: 'opening', className: 'text-right' },
            { data: 'balance', className: 'text-right', render: function (d, t) {
                var v = parseFloat(d) || 0;
                if (t === 'display') return (v < 0 ? '<span class="text-danger">' : '') + v.toFixed(2) + (v < 0 ? '</span>' : '');
                return v;
            }},
            { data: 'status', render: function (d, t) {
                if (t !== 'display') return d;
                return d == 1 ? '<span class="label label-success">Activa</span>' : '<span class="label label-default">Inactiva</span>';
            }},
            { data: null, orderable: false, render: function (d) {
                return '<a class="btn btn-info btn-xs" href="/bank/ledger?bank_id=' + d.id + '" title="Libro Bancario"><i class="fa fa-book"></i></a> ' +
                    '<a class="btn btn-primary btn-xs" href="/bank/edit/' + d.id + '" title="Editar"><i class="fa fa-pencil"></i></a> ' +
                    '<button class="btn btn-danger btn-xs do-del" data-id="' + d.id + '" title="Eliminar"><i class="fa fa-trash"></i></button>';
            }}
        ]
    });

    $('#bankTable').on('click', '.do-del', function () {
        var id = $(this).data('id');
        swal({
            title: "¿Eliminar cuenta bancaria?",
            text: "Se eliminará también su cuenta contable (si no tiene movimientos).",
            type: "warning",
            showCancelButton: true,
            confirmButtonText: "Eliminar",
            confirmButtonColor: ERPGo.appearance.css("--erp-danger", "#9c3333"),
            closeOnConfirm: true
        }, function () {
            $.post('/bank/delete/' + id, function (r) {
                if (r.status == 1) { toastr.success(r.msg); table.ajax.reload(); }
                else toastr.error(r.error || 'Error');
            }).fail(function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); });
        });
    });
});
</script>
{{end}}
