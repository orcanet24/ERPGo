{{define "customer_class_form.html"}}
{{template "header" .}}
<div class="row">
    <div class="col-lg-12">
        <div class="main-card mb-3 card">
            <div class="card-header">{{.Title}}</div>
            <div class="card-body">
                <form method="POST" action="/customer/class/save">
                    <input type="hidden" name="id" value="{{.EditID}}">
                    <div class="form-group">
                        <label>Etiqueta</label>
                        <input type="text" name="label" value="{{.Label}}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea name="description" class="form-control">{{.Description}}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Orden</label>
                        <input type="number" name="sort_order" value="{{.SortOrder}}" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="status" class="form-control">
                            <option value="active" {{if eq .Status "active"}}selected{{end}}>Activo</option>
                            <option value="inactive" {{if eq .Status "inactive"}}selected{{end}}>Inactivo</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="/customer/class/list" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{{template "footer" .}}
{{end}}
