{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <h3 class="panel-title">{{.Title}}</h3>
        <div class="btn-group pull-right">
            <a href="/order/list" class="btn btn-default btn-sm"><i class="fa fa-arrow-left"></i> Volver</a>
        </div>
    </div>
    <div class="panel-body">
        <form method="POST" action="/order/save" id="orderForm">
            <input type="hidden" name="edit_id" value="{{.EditID}}">
            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Cliente *</label>
                        <select name="customer_id" class="form-control" required>
                            <option value="">Seleccione...</option>
                            {{range .Customers}}
                            <option value="{{.id}}" {{with $.CustomerID}}{{if eq $.CustomerID (printf "%d" .id)}}selected{{end}}{{end}}>{{.name}}</option>
                            {{end}}
                        </select>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Fecha *</label>
                        <input type="date" name="date" class="form-control" value="{{.Date}}" required>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="form-group">
                        <label>Notas</label>
                        <input type="text" name="notes" class="form-control" placeholder="Observaciones del pedido" value="{{.Notes}}">
                    </div>
                </div>
            </div>

            <h4>Líneas de Productos</h4>
            <table class="table table-bordered" id="prodLines">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th width="120">Cantidad</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <button type="button" class="btn btn-info btn-sm" onclick="addLine()"><i class="fa fa-plus"></i> Añadir Producto</button>

            <hr>
            <button type="submit" name="action" value="save" class="btn btn-primary">Guardar</button>
            <a href="/order/list" class="btn btn-default">Cancelar</a>
        </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
const products = [{{range .Products}}{ id: '{{.id}}', name: '{{.name}}' },{{end}}];

function addLine(productID, qty) {
    const tbody = document.querySelector('#prodLines tbody');
    const tr = document.createElement('tr');
    let opts = '<select name="product_id" class="form-control"><option value="">Seleccione...</option>';
    products.forEach(s => { opts += '<option value="'+s.id+'">'+s.name+'</option>'; });
    opts += '</select>';
    tr.innerHTML = '<td>'+opts+'</td>' +
        '<td><input type="number" name="quantity" value="1" min="1" step="1" class="form-control"></td>' +
        '<td><button type="button" class="btn btn-danger btn-xs" onclick="this.closest(\'tr\').remove()"><i class="fa fa-trash"></i></button></td>';
    tbody.appendChild(tr);
    if (productID) {
        tr.querySelector('[name="product_id"]').value = productID;
        tr.querySelector('[name="quantity"]').value = qty || 1;
    }
}

$(function() {
    // Load existing lines if editing
    {{if .Details}}
    {{range .Details}}
    addLine('{{.product_id}}', '{{.quantity}}');
    {{end}}
    {{else}}
    addLine();
    {{end}}

    $('#orderForm').on('submit', function (e) {
        e.preventDefault();
        $.post('/order/save', $(this).serialize(), function (r) {
            if (r.status == 1) {
                toastr.success(r.msg);
                setTimeout(function () { location.href = '/order/list'; }, 800);
            } else {
                toastr.error(r.error || 'Error al guardar');
            }
        }).fail(function (x) {
            toastr.error(x.responseJSON ? x.responseJSON.error : 'Error');
        });
    });
});
</script>
{{end}}
