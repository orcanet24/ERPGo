{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <h3 class="panel-title">{{.Title}}</h3>
        <div class="btn-group pull-right">
            <a href="/service/add" class="btn btn-success btn-sm"><i class="fa fa-plus"></i> Nuevo Servicio</a>
        </div>
    </div>
    <div class="panel-body">
        <table class="table table-bordered table-striped" id="serviceTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Cargo</th>
                    <th>VAT</th>
                    <th>Tipo</th>
                    <th width="120">Acciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function() {
    $('#serviceTable').DataTable({
        processing: true,
        serverSide: true,
        ajax: '/service/list/data',
        columns: [
            { data: 'id' },
            { data: 'name' },
            { data: 'description' },
            { data: 'charge' },
            { data: 'vat' },
            { data: function(r) { return r.is_fixed ? 'Fijo' : 'Dinámico'; } },
            { data: null, render: function(d,t,r) {
                return '<a href="/service/edit/'+r.id+'" class="btn btn-xs btn-primary"><i class="fa fa-edit"></i></a> ' +
                       '<button class="btn btn-xs btn-danger" onclick="delServ('+r.id+')"><i class="fa fa-trash"></i></button>';
            }, orderable: false }
        ]
    });
});

function delServ(id) {
    swal({ title: "¿Eliminar servicio?", type: "warning", showCancelButton: true, confirmButtonText: "Sí, eliminar" },
    function(){ $.post('/service/delete/'+id, function(){ $('#serviceTable').DataTable().ajax.reload(); }); });
}
</script>
{{end}}
