{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>{{.Title}}</h4></div>
    </div>
    <div class="panel-body">
        <form id="employeeForm">
            <input type="hidden" name="id" value="{{if .Emp}}{{.Emp.ID}}{{end}}">
            <div class="row">
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Código *</label>
                        <input type="text" class="form-control" name="code" value="{{if .Emp}}{{.Emp.Code}}{{else}}{{.SuggestedCode}}{{end}}" required>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="form-group">
                        <label>Nombres *</label>
                        <input type="text" class="form-control" name="first_name" value="{{if .Emp}}{{.Emp.FirstName}}{{end}}" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Apellidos</label>
                        <input type="text" class="form-control" name="last_name" value="{{if .Emp}}{{.Emp.LastName}}{{end}}">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Cédula</label>
                        <input type="text" class="form-control" name="national_id" value="{{if .Emp}}{{.Emp.NationalID}}{{end}}">
                        <small class="help-block">Debe ser única: es lo que impide pagar dos nóminas a la misma persona.</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" name="email" value="{{if .Emp}}{{.Emp.Email}}{{end}}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" class="form-control" name="phone" value="{{if .Emp}}{{.Emp.Phone}}{{end}}">
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="form-group">
                        <label>Estado</label>
                        <select class="form-control" name="status">
                            <option value="1" {{if .Emp}}{{if eq .Emp.Status 1}}selected{{end}}{{else}}selected{{end}}>Activo</option>
                            <option value="0" {{if .Emp}}{{if eq .Emp.Status 0}}selected{{end}}{{end}}>Inactivo</option>
                            <option value="2" {{if .Emp}}{{if eq .Emp.Status 2}}selected{{end}}{{end}}>Egresado</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Departamento</label>
                        <select class="form-control" name="department_id">
                            <option value="0">— Sin asignar —</option>
                            {{range .Departments}}
                            <option value="{{.ID}}" {{if $.Emp}}{{if eq $.Emp.DepartmentID .ID}}selected{{end}}{{end}}>{{.Name}}</option>
                            {{end}}
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Cargo</label>
                        <select class="form-control" name="position_id">
                            <option value="0">— Sin asignar —</option>
                            {{range .Positions}}
                            <option value="{{.ID}}" {{if $.Emp}}{{if eq $.Emp.PositionID .ID}}selected{{end}}{{end}}>{{.Name}}</option>
                            {{end}}
                        </select>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Fecha de ingreso *</label>
                        <input type="date" class="form-control" name="hire_date" value="{{if .Emp}}{{.Emp.HireDate}}{{end}}" required>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Salario base *</label>
                        <input type="number" step="0.01" min="0" class="form-control" name="base_salary" value="{{if .Emp}}{{.Emp.BaseSalary}}{{else}}0{{end}}" required>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Frecuencia de pago *</label>
                        <select class="form-control" name="pay_frequency">
                            <option value="quincenal" {{if .Emp}}{{if eq .Emp.PayFrequency "quincenal"}}selected{{end}}{{else}}selected{{end}}>Quincenal</option>
                            <option value="mensual" {{if .Emp}}{{if eq .Emp.PayFrequency "mensual"}}selected{{end}}{{end}}>Mensual</option>
                        </select>
                        <small class="help-block">Determina el prorrateo del ISLR.</small>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" class="form-control" name="address" value="{{if .Emp}}{{.Emp.Address}}{{end}}">
                    </div>
                </div>
            </div>
            <button type="submit" name="action" value="save" class="btn btn-primary">Guardar</button>
            <button type="submit" name="action" value="save_exit" class="btn btn-default">Guardar y Salir</button>
            <a href="/hr/employee/list" class="btn btn-default">Cancelar</a>
        </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    var submittedAction = 'save';

    $('button[type=submit]', '#employeeForm').on('click', function () { submittedAction = $(this).val(); });

    $('#employeeForm').on('submit', function (e) {
        e.preventDefault();
        var btn = $(this).find('button[type=submit]').prop('disabled', true);
        $.post('/hr/employee/save', $(this).serialize(), function (r) {
            if (r.status == 1) {
                toastr.success(r.msg);
                if (submittedAction === 'save_exit') setTimeout(function () { location.href = '/hr/employee/list'; }, 700);
            } else {
                toastr.error(r.error || 'Error');
                btn.prop('disabled', false);
            }
        }).fail(function (x) {
            toastr.error(x.responseJSON ? x.responseJSON.error : 'Error');
            btn.prop('disabled', false);
        });
    });
});
</script>
{{end}}
