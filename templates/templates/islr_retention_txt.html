{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>Retención ISLR - Archivo TXT</h4></div>
    </div>
    <div class="panel-body">
        {{if .Error}}
        <div class="alert alert-danger">
            <i class="fa fa-exclamation-circle"></i> <strong>Error:</strong> {{.Error}}
        </div>
        {{else}}
        <div class="alert alert-success">
            <i class="fa fa-check-circle"></i> <strong>Generado correctamente</strong>
            <p style="margin-top:10px">El archivo <strong>retencion_islr_{{.Periodo}}.xml</strong> se ha generado exitosamente.</p>
            <p><strong>Período:</strong> {{.Periodo}}</p>
        </div>
        <div class="form-group">
            <label>Descargar nuevo archivo:</label>
            <form method="GET" action="/reports/islr-retention/txt" style="display:inline-block">
                <div class="input-group" style="width:300px">
                    <input type="text" class="form-control" name="periodo" placeholder="YYYYMM" maxlength="6" value="{{.Periodo}}">
                    <span class="input-group-btn">
                        <button type="submit" class="btn btn-success"><i class="fa fa-download"></i> Descargar XML</button>
                    </span>
                </div>
            </form>
        </div>
        {{end}}
        <a href="/reports/islr-retention" class="btn btn-primary"><i class="fa fa-arrow-left"></i> Volver a Retenciones ISLR</a>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    // Auto-submit if error
    {{if .Error}}
    setTimeout(function () {
        window.location.href = '/reports/islr-retention';
    }, 5000);
    {{end}}
});
</script>
{{end}}
