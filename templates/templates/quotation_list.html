{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <h3 class="panel-title">{{.Title}}</h3>
        <div class="btn-group pull-right">
            <a href="/quotation/new" class="btn btn-success btn-sm"><i class="fa fa-plus"></i> Nueva Cotización</a>
        </div>
    </div>
    <div class="panel-body">
        <table class="table table-bordered table-striped" id="quotTable">
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Fecha</th>
                    <th>Vence</th>
                    <th>Cliente</th>
                    <th>Subtotal</th>
                    <th>Descuento</th>
                    <th>VAT</th>
                    <th>Estado</th>
                    <th width="150">Acciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function() {
    $('#quotTable').DataTable({
        processing: true,
        serverSide: true,
        ajax: '/quotation/list/data',
        columns: [
            { data: 'quot_no' },
            { data: 'date' },
            { data: 'expire' },
            { data: 'customer' },
            { data: 'amount' },
            { data: 'discount' },
            { data: 'vat' },
            { data: function(r) { return r.status == 1 ? '<span class="label label-success">Activa</span>' : '<span class="label label-warning">Vencida</span>'; } },
            { data: null, render: function(d,t,r) {
                return '<a href="/quotation/details/'+r.id+'" class="btn btn-xs btn-info"><i class="fa fa-eye"></i></a> ' +
                       '<a href="/quotation/print/'+r.id+'" target="_blank" class="btn btn-xs btn-default"><i class="fa fa-print"></i></a> ' +
                       '<a href="/quotation/edit/'+r.id+'" class="btn btn-xs btn-primary"><i class="fa fa-edit"></i></a> ' +
                       '<button class="btn btn-xs btn-danger" onclick="delQuot(\''+r.id+'\')"><i class="fa fa-trash"></i></button>';
            }, orderable: false }
        ]
    });
});

function delQuot(id) {
    swal({ title: "¿Eliminar cotización?", type: "warning", showCancelButton: true, confirmButtonText: "Sí" },
    function(){ $.post('/quotation/delete/'+id, function(){ $('#quotTable').DataTable().ajax.reload(); }); });
}
</script>
{{end}}
