{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>ADDON: {{.Name}}</h4></div>
    </div>
    <div class="panel-body">
        <p>{{.Message}}</p>
        {{if .Description}}
        <p><strong>Descripción:</strong> {{.Description}}</p>
        {{end}}
        <hr>
        <h4>Configuración:</h4>
        <ul>
            <li><strong>Código:</strong> <code>{{.Code}}</code></li>
            <li><strong>Acceso:</strong> <code>/mod/{{.Code}}/</code></li>
        </ul>
    </div>
</div>
{{end}}

{{define "pagejs"}}{{end}}
