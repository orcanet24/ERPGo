{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title">
            <h4>Contactos <a href="/crm/contact/add" class="btn btn-primary btn-sm pull-right"><i class="fa fa-plus"></i> Nuevo Contacto</a></h4>
        </div>
    </div>
    <div class="panel-body">
        <table class="table table-striped table-bordered" id="contactTable" width="100%">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Empresa</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Origen</th>
                    <th class="text-right">Oportunidades</th>
                    <th class="text-right">Interacciones</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    var table = $('#contactTable').DataTable({
        processing: true,
        ajax: { url: '/crm/contact/list/data', type: 'GET' },
        columns: [
            { data: 'name' },
            { data: 'company' },
            { data: 'email' },
            { data: 'phone' },
            { data: 'source' },
            { data: 'opportunities', className: 'text-right' },
            { data: 'activities', className: 'text-right' },
            { data: null, render: function (d) {
                // Un contacto sin cliente vinculado todavía no es facturable:
                // la etiqueta lo hace visible en vez de dejarlo descubrir en la
                // cotización.
                return d.is_customer
                    ? '<span class="label label-success">Cliente</span>'
                    : '<span class="label label-default">Potencial</span>';
            }},
            { data: null, orderable: false, render: function (d) {
                return '<a class="btn btn-info btn-xs" href="/crm/contact/view/' + d.id + '" title="Ver ficha"><i class="fa fa-eye"></i></a>';
            }}
        ]
    });
});
</script>
{{end}}
