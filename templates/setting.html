{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>Configuración del Software</h4></div>
    </div>
    <div class="panel-body">
        <div class="alert alert-info" style="display:flex;align-items:center;gap:12px">
            <i class="fa fa-database" style="font-size:22px"></i>
            <div style="flex:1">
                <strong>Base de Datos:</strong> el sistema utiliza MySQL como motor de base de datos.
                Configure la conexión, verifique la integridad y administre sus respaldos.
            </div>
            <a href="/settings/database" class="btn btn-primary btn-sm">Administrar Base de Datos</a>
        </div>
        <form id="settingForm" enctype="multipart/form-data" style="max-width:700px">
            <div class="form-group">
                <label>Logo de la aplicación</label>
                <div>
                    <img src="{{if .Setting.Logo}}/{{.Setting.Logo}}{{else}}/static/img/icons/logo.png{{end}}" alt="Logo actual"
                        class="erp-thumb-box">
                </div>
                <input type="file" class="form-control" name="logo" accept="image/*">
            </div>
            <div class="form-group">
                <label>Logo de facturas / impresos</label>
                <div>
                    <img src="{{if .Setting.InvoiceLogo}}/{{.Setting.InvoiceLogo}}{{else}}{{if .Setting.Logo}}/{{.Setting.Logo}}{{else}}/static/img/icons/logo.png{{end}}{{end}}" alt="Logo de factura"
                        class="erp-thumb-box">
                </div>
                <input type="file" class="form-control" name="invoice_logo" accept="image/*">
            </div>
            <div class="form-group">
                <label>Favicon</label>
                <div>
                    <img src="{{if .Setting.Favicon}}/{{.Setting.Favicon}}{{else}}/static/img/icons/favicon.png{{end}}" alt="Favicon actual"
                        class="erp-thumb-box erp-thumb-sm">
                </div>
                <input type="file" class="form-control" name="favicon" accept="image/*">
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Símbolo de moneda</label>
                        <input type="text" class="form-control" name="currency" value="{{.Setting.Currency}}" maxlength="5">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Zona horaria</label>
                        <input type="text" class="form-control" name="timezone" value="{{.Setting.Timezone}}">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Idioma</label>
                        <select class="form-control" name="language">
                            <option value="spanish" {{if eq .Setting.Language "spanish"}}selected{{end}}>Español</option>
                            <option value="english" {{if eq .Setting.Language "english"}}selected{{end}}>English</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Orientación</label>
                        <select class="form-control" name="rtr">
                            <option value="0" {{if eq .Setting.Rtr "0"}}selected{{end}}>LTR (Izq→Der)</option>
                            <option value="1" {{if eq .Setting.Rtr "1"}}selected{{end}}>RTL (Der→Izq)</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Texto de pie de página</label>
                <input type="text" class="form-control" name="footer_text" value="{{.Setting.FooterText}}">
            </div>
            <div class="checkbox">
                <label>
                    <input type="checkbox" name="is_qr" value="1" {{if eq .Setting.IsQr 1}}checked{{end}}>
                    Mostrar código QR en facturas
                </label>
            </div>
            <div class="checkbox">
                <label>
                    <input type="checkbox" name="is_autoapprove_v" value="1" {{if eq .Setting.IsAutoapprove 1}}checked{{end}}>
                    Auto-aprobar comprobantes contables
                </label>
            </div>
            <div class="form-group">
                <label>Tipo de descuento</label>
                <select class="form-control" name="discount_type">
                    <option value="0" {{if eq .Setting.DiscountType 0}}selected{{end}}>Monto fijo</option>
                    <option value="1" {{if eq .Setting.DiscountType 1}}selected{{end}}>Porcentaje</option>
                </select>
            </div>
            <button type="submit" name="action" value="save" class="btn btn-primary">Guardar</button>
            <button type="submit" name="action" value="save_exit" class="btn btn-default">Guardar y Salir</button>
            </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    // vista previa inmediata al elegir un archivo (sin esperar al guardado)
    $('#settingForm input[type=file]').on('change', function () {
        if (this.files && this.files[0] && this.files[0].type.indexOf('image/') === 0) {
            var img = $(this).closest('.form-group').find('img');
            if (img.length) { img.attr('src', URL.createObjectURL(this.files[0])); }
        }
    });

    $('#settingForm').on('submit', function (e) {
        e.preventDefault();
        var fd = new FormData(this);
        $.ajax({
            url: '/settings/save', type: 'POST', data: fd,
            processData: false, contentType: false,
            success: function (r) {
                if (r.status == 1) { toastr.success(r.msg); ERPGo.refrescar(); }
                else toastr.error(r.error);
            },
            error: function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); }
        });
    });
});
</script>
{{end}}
