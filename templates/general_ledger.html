{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>Libro Mayor</h4></div>
    </div>
    <div class="panel-body">
        <form class="form-inline" id="ledgerFilter" style="margin-bottom:15px">
            <div class="form-group">
                <select class="form-control select2" id="headcode" name="headcode" style="width:350px" required>
                    <option value="">-- Seleccione cuenta --</option>
                    {{range .Heads}}
                    <option value="{{.id}}" {{if eq (printf "%v" .id) (query "headcode")}}selected{{end}}>{{.id}} - {{.name}}</option>
                    {{end}}
                </select>
            </div>
            <div class="form-group" style="margin-left:10px">
                <input type="date" class="form-control" id="from" name="from" value="2000-01-01">
            </div>
            <div class="form-group" style="margin-left:5px">
                <input type="date" class="form-control" id="to" name="to">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-left:5px"><i class="fa fa-search"></i> Consultar</button>
            <button type="button" class="btn btn-default" onclick="window.print()"><i class="fa fa-print"></i> Imprimir</button>
        </form>

        <div id="ledgerResult"></div>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
function loadLedger() {
    var hc = $('#headcode').val();
    if (!hc) return;
    $.getJSON('/account/ledger/data?headcode=' + hc + '&from=' + $('#from').val() + '&to=' + $('#to').val(), function (d) {
        var html = '<div class="print-area"><h4 id="ledgerTitle"></h4>' +
            '<p><strong>Balance de apertura:</strong> {{.Currency}} ' + d.opening + '</p>' +
            '<table class="table table-striped table-bordered"><thead><tr>' +
            '<th>Fecha</th><th>VNo</th><th>Tipo</th><th>Narración</th><th class="text-right">Débito</th><th class="text-right">Crédito</th><th class="text-right">Balance</th>' +
            '</tr></thead><tbody>';
        if (!d.data.length) html += '<tr><td colspan="7" class="text-center">Sin movimientos</td></tr>';
        d.data.forEach(function (r) {
            html += '<tr><td>' + r.date + '</td><td>' + r.vno + '</td><td>' + r.vtype + '</td><td>' + r.narration + '</td>' +
                '<td class="text-right">' + r.debit.toFixed(2) + '</td><td class="text-right">' + r.credit.toFixed(2) + '</td>' +
                '<td class="text-right">' + r.balance.toFixed(2) + '</td></tr>';
        });
        html += '</tbody><tfoot><tr><th colspan="4">Totales</th>' +
            '<th class="text-right">' + d.total_debit + '</th><th class="text-right">' + d.total_credit + '</th>' +
            '<th class="text-right">Cierre: ' + d.closing + '</th></tr></tfoot></table></div>';
        $('#ledgerResult').html(html);
        $('#ledgerTitle').text('Cuenta: ' + $('#headcode option:selected').text());
    });
}
$(function () {
    $('#to').val(new Date().toISOString().slice(0, 10));
    $('#ledgerFilter').on('submit', function (e) { e.preventDefault(); loadLedger(); });
    $('#headcode').on('change', loadLedger);
    loadLedger();
});
</script>
{{end}}
