{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>{{.Title}}</h4></div>
    </div>
    <div class="panel-body">
        <form id="permForm">
            <input type="hidden" name="role_id" value="{{.RoleID}}">
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th style="width:40%">Submódulo</th>
                        <th class="text-center">Crear</th>
                        <th class="text-center">Ver</th>
                        <th class="text-center">Actualizar</th>
                        <th class="text-center">Eliminar</th>
                    </tr>
                </thead>
                <tbody>
                {{range .Perms}}
                    <tr>
                        <td>{{.Name}} <input type="hidden" name="sub_module_id" value="{{.SubID}}"></td>
                        <td class="text-center"><input type="checkbox" name="create_{{.SubID}}" value="1" {{if eq .Create 1}}checked{{end}}></td>
                        <td class="text-center"><input type="checkbox" name="read_{{.SubID}}" value="1" {{if eq .Read 1}}checked{{end}}></td>
                        <td class="text-center"><input type="checkbox" name="update_{{.SubID}}" value="1" {{if eq .Update 1}}checked{{end}}></td>
                        <td class="text-center"><input type="checkbox" name="delete_{{.SubID}}" value="1" {{if eq .Delete 1}}checked{{end}}></td>
                    </tr>
                {{end}}
                </tbody>
            </table>
            <button type="submit" name="action" value="save" class="btn btn-primary">Guardar</button>
            <button type="submit" name="action" value="save_exit" class="btn btn-default">Guardar y Salir</button>
            <a href="/role/list" class="btn btn-default">Volver</a>
        </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    $('#permForm').on('submit', function (e) {
        e.preventDefault();
        var data = $(this).serialize();
        // unchecked checkboxes are not serialized; add them as 0
        $('#permForm input[type=checkbox]').each(function () {
            if (!$(this).is(':checked')) data += '&' + this.name + '=0';
        });
        $.post('/role/permissions', data, function (r) {
            if (r.status == 1) toastr.success(r.msg);
            else toastr.error(r.error);
        }).fail(function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); });
    });
});
</script>
{{end}}
