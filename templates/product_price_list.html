{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>Precios de Productos</h4></div>
    </div>
    <div class="panel-body">
        <table class="table table-striped table-bordered" id="productPriceTable" width="100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th class="text-right">Precio Base</th>
                    <th class="text-right">Precio Detalle</th>
                    <th class="text-right">Precio Mayor</th>
                    <th class="text-right">Precio Gran Mayor</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
var CUR = '{{.Currency}}';
$(function () {
    var table = $('#productPriceTable').DataTable({
        processing: true,
        serverSide: true,
        pageLength: 25,
        ajax: { url: '/product_price/data', type: 'POST' },
        columns: [
            { data: 'product_id' },
            { data: 'product_name' },
            { data: 'price', className: 'text-right', render: function (d) {
                return '<span class="erp-value-primary">' + CUR + ' ' + (parseFloat(d) || 0).toFixed(2) + '</span>';
            }},
            { data: 'price_detalle', className: 'text-right', render: function (d) {
                return CUR + ' ' + (parseFloat(d) || 0).toFixed(2);
            }},
            { data: 'price_mayor', className: 'text-right', render: function (d) {
                return CUR + ' ' + (parseFloat(d) || 0).toFixed(2);
            }},
            { data: 'price_gran_mayor', className: 'text-right', render: function (d) {
                return CUR + ' ' + (parseFloat(d) || 0).toFixed(2);
            }}
        ]
    });
});
</script>
{{end}}
