{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title">
            <h4>Compras
                <a href="/purchase/add" class="btn btn-primary btn-sm pull-right"><i class="fa fa-plus"></i> Nueva Compra</a>
            </h4>
        </div>
    </div>
    <div class="panel-body">
        <table class="table table-striped table-bordered" id="purchaseTable" width="100%">
            <thead>
                <tr>
                    <th>Compra</th>
                    <th>Chalan</th>
                    <th>Proveedor</th>
                    <th class="text-right">Total</th>
                    <th class="text-right">Pagado</th>
                    <th class="text-right">Due</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
var CUR = '{{.Currency}}';
$(function () {
    var table = $('#purchaseTable').DataTable({
        processing: true,
        serverSide: true,
        pageLength: 25,
        order: [[0, 'desc']],
        ajax: { url: '/purchase/list/data', type: 'POST' },
        columns: [
            { data: 'id', render: function (d) { return '#' + d; } },
            { data: 'chalan' },
            { data: 'supplier' },
            { data: 'total', className: 'text-right' },
            { data: 'paid', className: 'text-right' },
            { data: 'due', className: 'text-right', render: function (d) {
                var n = parseFloat(d) || 0;
                return n > 0 ? '<span class="erp-value-danger">' + d + '</span>' : d;
            }},
            { data: 'date' },
            { data: null, orderable: false, searchable: false, render: function (d) {
                return '<a class="btn btn-info btn-xs" href="/purchase/details/' + d.id + '" title="Ver"><i class="fa fa-eye"></i></a> ' +
                    '<a class="btn btn-warning btn-xs" href="/purchase/edit/' + d.id + '" title="Editar"><i class="fa fa-pencil"></i></a> ' +
                    '<button class="btn btn-danger btn-xs do-del" data-id="' + d.id + '" title="Eliminar"><i class="fa fa-trash"></i></button>';
            }}
        ]
    });

    $('#purchaseTable').on('click', '.do-del', function () {
        var id = $(this).data('id');
        swal({
            title: "¿Eliminar compra #" + id + "?",
            text: "Se eliminarán también sus comprobantes contables.",
            type: "warning",
            showCancelButton: true,
            confirmButtonText: "Eliminar",
            confirmButtonColor: ERPGo.appearance.css("--erp-danger", "#9c3333")
        }, function () {
            $.post('/purchase/delete/' + id, function (r) {
                if (r.status == 1) { toastr.success(r.msg); table.ajax.reload(); }
                else toastr.error(r.error || 'Error');
            }).fail(function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); });
        });
    });
});
</script>
{{end}}
