{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>{{.Title}}</h4></div>
    </div>
    <div class="panel-body">
        <form class="form-inline" id="repFilter" style="margin-bottom:15px">
            <div class="form-group">
                <label>Desde </label>
                <input type="date" class="form-control" id="from" value="{{.From}}">
            </div>
            <div class="form-group" style="margin-left:5px">
                <label>Hasta </label>
                <input type="date" class="form-control" id="to" value="{{.To}}">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-left:5px"><i class="fa fa-search"></i> Consultar</button>
            <button type="button" class="btn btn-default" id="btnPrint"><i class="fa fa-print"></i> Imprimir</button>
        </form>

        <div class="print-area">
        <table class="table table-striped table-bordered" id="repTable" width="100%">
            <thead>
                <tr>
                    <th>Fecha</th><th>Compra</th><th>Proveedor</th>
                    <th class="text-right">Total</th><th class="text-right">Pagado</th><th class="text-right">Por Pagar</th>
                </tr>
            </thead>
            <tfoot>
                <tr>
                    <th colspan="3" class="text-right">TOTALES</th>
                    <th class="text-right" id="tTotal">0.00</th>
                    <th class="text-right" id="tPaid">0.00</th>
                    <th class="text-right" id="tDue">0.00</th>
                </tr>
            </tfoot>
        </table>
        </div>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    $('#repFilter').on('submit', function (e) { e.preventDefault(); load(); });
    $('#btnPrint').on('click', function () { window.print(); });
    load();
});
function load() {
    $.getJSON('/reports/purchases/data?from=' + $('#from').val() + '&to=' + $('#to').val(), function (d) {
        var rows = d.data.map(function (r) {
            return [r.date, '#' + r.purchase, r.supplier,
                parseFloat(r.total).toFixed(2), parseFloat(r.paid).toFixed(2), parseFloat(r.due).toFixed(2)];
        });
        $('#repTable').DataTable({
            destroy: true, data: rows,
            columns: [{}, {}, {}, { className: 'text-right' }, { className: 'text-right' }, { className: 'text-right' }],
            order: [[0, 'desc']]
        });
        $('#tTotal').text(parseFloat(d.total).toFixed(2));
        $('#tPaid').text(parseFloat(d.paid).toFixed(2));
        $('#tDue').text(parseFloat(d.due).toFixed(2));
    });
}
</script>
{{end}}
