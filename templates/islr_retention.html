{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>{{.Title}}</h4></div>
    </div>
    <div class="panel-body">
        <form class="form-inline" id="repFilter" style="margin-bottom:15px">
            <div class="form-group">
                <label>Mes </label>
                <select class="form-control" id="month">
                    <option value="1" {{if eq .Month "1"}}selected{{end}}>Enero</option>
                    <option value="2" {{if eq .Month "2"}}selected{{end}}>Febrero</option>
                    <option value="3" {{if eq .Month "3"}}selected{{end}}>Marzo</option>
                    <option value="4" {{if eq .Month "4"}}selected{{end}}>Abril</option>
                    <option value="5" {{if eq .Month "5"}}selected{{end}}>Mayo</option>
                    <option value="6" {{if eq .Month "6"}}selected{{end}}>Junio</option>
                    <option value="7" {{if eq .Month "7"}}selected{{end}}>Julio</option>
                    <option value="8" {{if eq .Month "8"}}selected{{end}}>Agosto</option>
                    <option value="9" {{if eq .Month "9"}}selected{{end}}>Septiembre</option>
                    <option value="10" {{if eq .Month "10"}}selected{{end}}>Octubre</option>
                    <option value="11" {{if eq .Month "11"}}selected{{end}}>Noviembre</option>
                    <option value="12" {{if eq .Month "12"}}selected{{end}}>Diciembre</option>
                </select>
            </div>
            <div class="form-group" style="margin-left:5px">
                <label>Año </label>
                <input type="number" class="form-control" id="year" value="{{.Year}}" style="width:80px">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-left:5px"><i class="fa fa-search"></i> Consultar</button>
            <button type="button" class="btn btn-default" id="btnPrint"><i class="fa fa-print"></i> Imprimir</button>
        </form>

        <div class="print-area">
        <table class="table table-striped table-bordered" id="repTable" width="100%">
            <thead>
                <tr>
                    <th>Fecha</th><th>N° Comprobante</th><th>RIF Proveedor</th><th>Proveedor</th>
                    <th>Concepto</th><th class="text-right">Base Imponible</th>
                    <th class="text-right">%</th><th class="text-right">Retenido</th>
                </tr>
            </thead>
            <tfoot>
                <tr>
                    <th colspan="5" class="text-right">TOTALES</th>
                    <th class="text-right" id="tBase">0.00</th>
                    <th></th>
                    <th class="text-right" id="tRet">0.00</th>
                </tr>
            </tfoot>
        </table>
        </div>

        <!-- Formulario de nueva retención ISLR -->
        <div class="panel panel-default" style="margin-top:20px">
            <div class="panel-heading"><h5><i class="fa fa-plus"></i> Nueva Retención ISLR</h5></div>
            <div class="panel-body">
                <form id="frmIslrRetention" class="form-horizontal">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>N° Comprobante</label>
                                <input type="text" class="form-control" name="retention_no" placeholder="RET-ISLR-001" required>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Fecha</label>
                                <input type="date" class="form-control" name="date" required>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Proveedor</label>
                                <select class="form-control" name="supplier_id">
                                    <option value="">-- Seleccionar --</option>
                                    {{range .Suppliers}}<option value="{{.id}}">{{.name}} ({{.rif}})</option>{{end}}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Concepto</label>
                                <input type="text" class="form-control" name="concept" placeholder="Servicios Profesionales" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Base Imponible ({{.Currency}})</label>
                                <input type="number" step="0.01" class="form-control" name="base_amount" required>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <div class="form-group">
                                <label>% Retención</label>
                                <select class="form-control" name="retention_percent">
                                    <option value="2">2%</option>
                                    <option value="5" selected>5%</option>
                                    <option value="10">10%</option>
                                    <option value="15">15%</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <div class="form-group">
                                <label>Monto Retenido ({{.Currency}})</label>
                                <input type="number" step="0.01" class="form-control" name="retention_amount">
                            </div>
                        </div>
                        <div class="col-md-2" style="margin-top:25px">
                            <button type="submit" name="action" value="save" class="btn btn-success btn-sm">Guardar</button>
            <button type="submit" name="action" value="save_exit" class="btn btn-default btn-sm">Guardar y Salir</button>
            </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    $('#repFilter').on('submit', function (e) { e.preventDefault(); load(); });
    $('#btnPrint').on('click', function () {
        window.open('/reports/islr-retention/print?month=' + $('#month').val() + '&year=' + $('#year').val(), '_blank');
    });
    var submittedAction = 'save';
    $('button[type=submit]', '#frmIslrRetention').on('click', function () { submittedAction = $(this).val(); });

    $('#frmIslrRetention').on('submit', function (e) {
        e.preventDefault();
        $.post('/reports/islr-retention/save', $(this).serialize(), function (d) {
            if (d.status) {
                // El aviso y la tabla: sin alert() que bloquea la pantalla ni
                // recarga de la vista. load() vuelve a pedir las filas y los
                // totales al servidor.
                toastr.success(d.msg || 'Retención guardada');
                if (submittedAction === 'save_exit') {
                    setTimeout(function () { location.href = d.redirect || '/reports/islr-retention'; }, 700);
                } else {
                    load();
                    // El formulario se limpia: es lo que hacía la recarga y es lo
                    // que evita que un segundo clic mande la misma retención dos
                    // veces.
                    var frm = document.getElementById('frmIslrRetention');
                    if (frm) { frm.reset(); }
                }
            } else {
                toastr.error(d.error || 'Error');
            }
        }).fail(function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); });
    });
    load();
});
function load() {
    $.getJSON('/reports/islr-retention/data?month=' + $('#month').val() + '&year=' + $('#year').val(), function (d) {
        var rows = d.data.map(function (r) {
            return [r.date, r.retention_no, r.rif || '', r.supplier, r.concept,
                parseFloat(r.base_amount).toFixed(2), parseFloat(r.retention_percent).toFixed(2) + '%',
                parseFloat(r.retention_amount).toFixed(2)];
        });
        $('#repTable').DataTable({
            destroy: true, data: rows,
            columns: [{}, {}, {}, {}, {}, { className: 'text-right' }, { className: 'text-center' },
                { className: 'text-right' }],
            order: [[0, 'asc']]
        });
        $('#tBase').text(parseFloat(d.total_base || 0).toFixed(2));
        $('#tRet').text(parseFloat(d.total_retention || 0).toFixed(2));
    });
}
</script>
{{end}}
