{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title">
            <h4>Ajustes de Inventario
                <span class="btn-group pull-right">
                    <a href="/adjustment/new" class="btn btn-primary btn-sm"><i class="fa fa-plus"></i> Nuevo Ajuste</a>
                </span>
            </h4>
        </div>
    </div>
    <div class="panel-body">
        <table class="table table-striped table-bordered" id="adjustmentTable" width="100%">
            <thead>
                <tr>
                    <th>Ajuste Nº</th>
                    <th>Fecha</th>
                    <th>Almacén</th>
                    <th>Referencia</th>
                    <th class="text-center">Items</th>
                    <th>Nota</th>
                    <th>Acciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    var table = $('#adjustmentTable').DataTable({
        processing: true,
        serverSide: true,
        pageLength: 25,
        order: [[0, 'desc']],
        ajax: { url: '/adjustment/list/data', type: 'POST' },
        columns: [
            { data: 'adjustment_no', render: function (d) { return '<a href="/adjustment/details/' + d + '">' + d + '</a>'; } },
            { data: 'date' },
            { data: 'warehouse' },
            { data: 'reference' },
            { data: 'items', className: 'text-center' },
            { data: 'note' },
            { data: null, orderable: false, searchable: false, render: function (d) {
                return '<a class="btn btn-link btn-xs" href="/adjustment/details/' + d.id + '" title="Ver detalle"><i class="fa fa-eye"></i> Ver</a> ' +
                    // D-4 (auditoría 2026-11-22): no se ELIMINA —eso borraba
                    // kardex y mayor—; se revierte creando el ajuste inverso.
                    '<button class="btn btn-default btn-xs do-revert" data-id="' + d.id + '" data-adj="' + d.adjustment_no + '" title="Revertir (crea el ajuste inverso)"><i class="fa fa-undo"></i></button>';
            }}
        ]
    });

    $('#adjustmentTable').on('click', '.do-revert', function () {
        var id = $(this).data('id');
        var adj = $(this).data('adj') || ('#' + id);
        swal({
            title: "¿Revertir el ajuste " + adj + "?",
            text: "Se creará el ajuste inverso con su asiento en la fecha de hoy. El ajuste original queda visible: la contabilidad no borra, corrige.",
            type: "warning",
            showCancelButton: true,
            confirmButtonText: "Revertir",
            confirmButtonColor: ERPGo.appearance.css("--erp-danger", "#9c3333")
        }, function () {
            $.post('/adjustment/revert/' + id, function (r) {
                if (r.status == 1) { toastr.success(r.msg); table.ajax.reload(); }
                else toastr.error(r.error || 'Error');
            }).fail(function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); });
        });
    });
});
</script>
{{end}}
