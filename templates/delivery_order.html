{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>{{.Title}}
            <a href="/delivery_order/list" class="btn btn-default btn-sm pull-right"><i class="fa fa-arrow-left"></i> Volver</a>
        </h4></div>
    </div>
    <div class="panel-body">
        <form id="deliveryOrderForm">
            <input type="hidden" name="id" value="{{if .DO}}{{.DO.ID.String}}{{end}}">
            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Cliente *</label>
                        <select class="form-control" name="customer_id" required>
                            <option value="">-- Seleccione --</option>
                            {{range .Customers}}
                            <option value="{{.id}}" {{if $.DO}}{{if eq $.DO.CustomerID (printf "%d" .id)}}selected{{end}}{{end}}>{{.name}}</option>
                            {{end}}
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Almacén / Bodega *</label>
                        <select class="form-control" name="warehouse_id" required>
                            <option value="">-- Seleccione --</option>
                            {{range .Warehouses}}
                            <option value="{{.id}}" {{if $.DO}}{{if eq $.DO.WarehouseID (printf "%d" .id)}}selected{{end}}{{end}}>{{.name}}</option>
                            {{end}}
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Referencia de Factura</label>
                        <input type="text" class="form-control" name="invoice_ref" value="{{if .DO}}{{.DO.InvoiceRef.String}}{{end}}" placeholder="Ej: INV-001-12345">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Fecha *</label>
                        <input type="date" class="form-control" name="order_date" value="{{if .DO}}{{.DO.Date}}{{else}}{{today}}{{end}}" required>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="form-group">
                        <label>Notas</label>
                        <input type="text" class="form-control" name="notes" value="{{if .DO}}{{.DO.Notes.String}}{{end}}" placeholder="Notas u observaciones...">
                    </div>
                </div>
            </div>

            <hr>
            <h4>Líneas de Productos</h4>

            <div class="row" style="margin-bottom:15px">
                <div class="col-sm-12">
                    <div class="input-group">
                        <input type="text" class="form-control" id="productSearch" placeholder="Buscar producto por nombre o modelo...">
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-primary" id="addSelectedProduct"><i class="fa fa-plus"></i> Agregar</button>
                        </span>
                    </div>
                    <div id="productResults" class="list-group" style="position:absolute;z-index:1000;width:100%;max-height:300px;overflow-y:auto;display:none"></div>
                </div>
            </div>

            <table class="table table-bordered table-hover" id="orderLinesTable">
                <thead>
                    <tr class="bg-primary">
                        <th style="width:5%">#</th>
                        <th style="width:30%">Producto</th>
                        <th style="width:12%">Stock</th>
                        <th style="width:15%">Cantidad</th>
                        <th style="width:18%">Precio Unit.</th>
                        <th style="width:10%">Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="6" class="text-center text-muted" id="emptyMsg">No hay productos. Busque y agregue productos arriba.</td></tr>
                </tbody>
            </table>

            <hr>
            <div class="text-right">
                <a href="/delivery_order/list" class="btn btn-default">Cancelar</a>
                <button type="submit" class="btn btn-success btn-lg"><i class="fa fa-save"></i> Guardar Orden de Entrega</button>
            </div>
        </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
var selectedProducts = [];
var rowIndex = 0;

$('#productSearch').on('input', function () {
    var term = $(this).val().trim();
    if (term.length < 2) { $('#productResults').hide(); return; }
    $.get('/product/autocomplete', { term: term }, function (data) {
        var html = '';
        $.each(data, function (i, p) {
            var label = p.name + ' (' + p.model + ') - Stock: ' + p.stock;
            html += '<a href="#" class="list-group-item product-result" data-id="' + p.product_id + '" data-name="' + p.name + '" data-model="' + p.model + '" data-stock="' + p.stock + '" data-price="' + p.price + '">' + label + '</a>';
        });
        $('#productResults').html(html).show();
    });
});

$(document).on('click', '.product-result', function (e) {
    e.preventDefault();
    var id = $(this).data('id');
    if (selectedProducts.indexOf(id) !== -1) {
        toastr.warning('El producto ya está en la lista');
        $('#productResults').hide();
        return;
    }
    selectedProducts.push(id);
    addProductRow(id, $(this).data('name'), $(this).data('model'), $(this).data('stock'), $(this).data('price'));
    $('#productResults').hide();
    $('#productSearch').val('');
});

function addProductRow(id, name, model, stock, price) {
    rowIndex++;
    $('#emptyMsg').closest('tr').remove();
    var html = '<tr data-index="' + rowIndex + '">' +
        '<td>' + rowIndex + '</td>' +
        '<td><strong>' + name + '</strong> (' + model + ')</td>' +
        '<td>' + stock + '</td>' +
        '<td><input type="number" class="form-control input-sm order-qty" name="quantity" step="0.01" min="0.01" value="1.00" required></td>' +
        '<td><input type="number" class="form-control input-sm order-price" name="unit_price" step="0.01" min="0" value="' + parseFloat(price).toFixed(2) + '" required></td>' +
        '<td><input type="hidden" name="product_id" value="' + id + '">' +
            '<button type="button" class="btn btn-danger btn-xs remove-row"><i class="fa fa-trash"></i></button></td>' +
        '</tr>';
    $('#orderLinesTable tbody').append(html);
}

$(document).on('click', '.remove-row', function () {
    var id = $(this).closest('tr').find('input[name="product_id"]').val();
    selectedProducts = selectedProducts.filter(function (v) { return v !== id; });
    $(this).closest('tr').remove();
    if ($('#orderLinesTable tbody tr').length === 0) {
        $('#orderLinesTable tbody').append('<tr><td colspan="6" class="text-center text-muted" id="emptyMsg">No hay productos. Busque y agregue productos arriba.</td></tr>');
    }
});

$(document).on('click', function (e) {
    if (!$(e.target).closest('#productResults, #productSearch').length) {
        $('#productResults').hide();
    }
});

$('#deliveryOrderForm').on('submit', function (e) {
    e.preventDefault();
    if (selectedProducts.length === 0) {
        toastr.error('Debe agregar al menos un producto');
        return false;
    }
    var btn = $(this).find('button[type=submit"]').prop('disabled', true);
    $.post('/deliveryorder/save', $(this).serialize(), function (r) {
        if (r.status == 1) {
            toastr.success(r.msg);
            setTimeout(function () { location.href = '/delivery_order/list'; }, 700);
        } else {
            toastr.error(r.error || 'Error');
            btn.prop('disabled', false);
        }
    }).fail(function (x) {
        toastr.error(x.responseJSON ? x.responseJSON.error : 'Error');
        btn.prop('disabled', false);
    });
});
</script>
{{end}}
