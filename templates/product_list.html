{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title">
            <h4>Productos
                <a href="/product/add" class="btn btn-primary btn-sm pull-right"><i class="fa fa-plus"></i> Añadir Producto</a>
            </h4>
        </div>
    </div>
    <div class="panel-body">
        <table class="table table-striped table-bordered" id="productTable" width="100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Modelo</th>
                    <th>Tipo</th>
                    <th>Categoría</th>
                    <th>Unidad</th>
                    <th class="text-right">Precio</th>
                    <th class="text-right">Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
var CUR = '{{.Currency}}';
$(function () {
    var table = $('#productTable').DataTable({
        processing: true,
        serverSide: true,
        pageLength: 25,
        ajax: { url: '/product/list/data', type: 'POST' },
        columns: [
            { data: 'id' },
            { data: 'name' },
            { data: 'model' },
            { data: 'type_label', render: function (d, t, row) {
                if (row.item_type === 'servicio') return '<span class="label label-info">' + d + '</span>';
                if (row.item_type === 'consumo') return '<span class="label label-warning">' + d + '</span>';
                return d;
            } },
            { data: 'category' },
            { data: 'unit' },
            { data: 'price', className: 'text-right', render: function (d) {
                return CUR + ' ' + (parseFloat(d) || 0).toFixed(2);
            }},
            { data: 'stock', className: 'text-right', render: function (d) {
                var n = parseFloat(d) || 0;
                if (n <= 5) return '<span class="erp-value-danger">' + n + '</span>';
                return n;
            }},
            { data: null, orderable: false, searchable: false, render: function (d) {
                return '<a class="btn btn-info btn-xs" href="/product/details/' + d.id + '" title="Detalle"><i class="fa fa-eye"></i></a> ' +
                    '<a class="btn btn-warning btn-xs" href="/product/edit/' + d.id + '" title="Editar"><i class="fa fa-pencil"></i></a> ' +
                    '<button class="btn btn-danger btn-xs do-del" data-id="' + d.id + '" title="Eliminar"><i class="fa fa-trash"></i></button>';
            }}
        ]
    });

    $('#productTable').on('click', '.do-del', function () {
        var id = $(this).data('id');
        swal({
            title: "¿Eliminar producto?",
            text: "Esta acción no se puede deshacer.",
            type: "warning",
            showCancelButton: true,
            confirmButtonText: "Eliminar",
            confirmButtonColor: ERPGo.appearance.css("--erp-danger", "#9c3333"),
            closeOnConfirm: true
        }, function () {
            $.post('/product/delete/' + id, function (r) {
                if (r.status == 1) { toastr.success(r.msg); table.ajax.reload(); }
                else toastr.error(r.error || 'Error');
            }).fail(function (x) {
                toastr.error(x.responseJSON ? x.responseJSON.error : 'Error');
            });
        });
    });
});
</script>
{{end}}
