{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <h3 class="panel-title">{{.Title}}</h3>
        <div class="btn-group pull-right">
            <a href="/service/invoice/new" class="btn btn-success btn-sm"><i class="fa fa-plus"></i> Nueva Factura de Servicio</a>
        </div>
    </div>
    <div class="panel-body">
        <table class="table table-bordered table-striped" id="srvInvTable">
            <thead>
                <tr>
                    <th>No. Voucher</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>Pagado</th>
                    <th>Pendiente</th>
                    <th>Tipo</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function() {
    $('#srvInvTable').DataTable({
        processing: true,
        serverSide: false,
        ajax: '/service/invoice/data',
        columns: [
            { data: 'voucher' },
            { data: 'date' },
            { data: 'customer' },
            { data: 'total' },
            { data: 'paid' },
            { data: 'due' },
            { data: function(r) { return r.is_credit == 1 ? 'Crédito' : 'Contado'; } }
        ]
    });
});
</script>
{{end}}
