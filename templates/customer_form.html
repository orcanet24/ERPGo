{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>{{.Title}}</h4></div>
    </div>
    <div class="panel-body">
        <form id="customerForm">
            <input type="hidden" name="customer_id" value="{{if .C}}{{.C.ID.String}}{{end}}">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Nombre *</label>
                        <input type="text" class="form-control" name="customer_name" value="{{if .C}}{{.C.Name.String}}{{end}}" required>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Tipo de documento</label>
                        <select name="rif_tipo" id="rifTipo" class="form-control">
                            <option value="rif" selected>RIF (completo, con verificador)</option>
                            <option value="cedula">Cédula (V/E, sin rellenar ceros)</option>
                        </select>
                        <small class="erp-caption">J y G son siempre RIF. V y E pueden ser cédula o firma personal (RIF asignado).</small>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>RIF / Cédula <small class="text-muted">(obligatorio para crédito fiscal)</small></label>
                        <input type="text" class="form-control" name="rif" id="rifInput" placeholder="J-12345678-9 o V-12345678" value="{{if .C}}{{.C.RIF.String}}{{end}}">
                        <small id="rifHelp" class="help-block erp-footnote">Se valida automáticamente (dígito verificador)</small>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Móvil</label>
                        <input type="text" class="form-control" name="customer_mobile" value="{{if .C}}{{.C.Mobile.String}}{{end}}">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" name="customer_email" value="{{if .C}}{{.C.Email.String}}{{end}}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Email alternativo</label>
                        <input type="email" class="form-control" name="email_address" value="{{if .C}}{{.C.Email2.String}}{{end}}">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Contacto</label>
                        <input type="text" class="form-control" name="contact" value="{{if .C}}{{.C.Contact.String}}{{end}}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" class="form-control" name="phone" value="{{if .C}}{{.C.Phone.String}}{{end}}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Fax</label>
                        <input type="text" class="form-control" name="fax" value="{{if .C}}{{.C.Fax.String}}{{end}}">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" class="form-control" name="customer_address" value="{{if .C}}{{.C.Address.String}}{{end}}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Dirección 2</label>
                        <input type="text" class="form-control" name="address2" value="{{if .C}}{{.C.Address2.String}}{{end}}">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Ciudad</label>
                        <input type="text" class="form-control" name="city" value="{{if .C}}{{.C.City.String}}{{end}}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Estado</label>
                        <input type="text" class="form-control" name="state" value="{{if .C}}{{.C.State.String}}{{end}}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Código Postal</label>
                        <input type="text" class="form-control" name="zip" value="{{if .C}}{{.C.Zip.String}}{{end}}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>País</label>
                        <input type="text" class="form-control" name="country" value="{{if .C}}{{.C.Country.String}}{{end}}">
                    </div>
                </div>
            </div>
            <button type="submit" name="action" value="save" class="btn btn-primary">Guardar</button>
            <button type="submit" name="action" value="save_exit" class="btn btn-default">Guardar y Salir</button>
            <a href="/customer/list" class="btn btn-default">Volver</a>
        </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
// Validación RIF en vivo (módulo 11 SENIAT) — feedback inmediato
$(function () {
    var submittedAction = 'save';

    $('button[type=submit]', '#customerForm').on('click', function () { submittedAction = $(this).val(); });

    function validateRIFLive(rif) {
        rif = (rif || '').toUpperCase().replace(/[.\- ]/g, '');
        if (!rif) return { ok: true, msg: '' };
        // La LETRA manda sobre el selector: J/G son siempre RIF completo (una
        // jurídica no puede ser cédula). Con cédula declarada, V/E no requieren
        // 10 caracteres ni dígito verificador: no se rellena con ceros.
        var tipo = $('#rifTipo').val() || 'rif';
        if (rif[0] === 'J' || rif[0] === 'G') tipo = 'rif';
        if (tipo === 'cedula') {
            if (!'VE'.includes(rif[0])) return { ok: false, msg: 'Una cédula inicia con V o E (firma personal = RIF)'};
            var dig = rif.slice(1);
            if (!/^\d+$/.test(dig)) return { ok: false, msg: 'La cédula solo lleva dígitos después de la letra' };
            if (dig.length < 3 || dig.length > 8) return { ok: false, msg: 'La cédula tiene de 3 a 8 dígitos (sin rellenar ceros)' };
            return { ok: true, msg: '✓ Cédula válida (sin verificador)' };
        }
        if (rif.length !== 10) return { ok: false, msg: 'El RIF debe tener 10 caracteres (ej: J123456789)' };
        if (!'JVGECPR'.includes(rif[0])) return { ok: false, msg: 'Debe iniciar con J, V, G, E, P, R o C' };
        var letraVal = {V:4, E:8, J:12, P:16, G:20};
        var pesos = [3,2,7,6,5,4,3,2];
        var sum = letraVal[rif[0]] || 0;
        for (var i = 0; i < 8; i++) {
            var d = parseInt(rif[i+1], 10);
            if (isNaN(d)) return { ok: false, msg: 'Posiciones 2-9 deben ser dígitos' };
            sum += d * pesos[i];
        }
        var dv = 11 - (sum % 11);
        if (dv >= 10) dv = 0;
        if (dv !== parseInt(rif[9], 10)) return { ok: false, msg: 'Dígito verificador inválido (esperado: ' + dv + ')' };
        return { ok: true, msg: '✓ RIF válido' };
    }
    $('#rifInput').on('input', function () {
        var r = validateRIFLive($(this).val());
        var $h = $('#rifHelp');
        $h.text(r.msg || 'Se valida automáticamente (dígito verificador)');
        // Las clases del tema en vez de colores escritos aquí: con un hex en
        // el JavaScript, un RIF válido se pintaba verde también en el tema
        // oscuro, y con el fondo oscuro quedaba casi ilegible.
        $h.removeClass('erp-value-ok erp-value-danger').addClass(r.ok ? 'erp-value-ok' : 'erp-value-danger');
    }).trigger('input');

    $('#rifTipo').on('change', function () {
        $('#rifInput').attr('placeholder', $(this).val() === 'cedula' ? 'V-12345678' : 'J-12345678-9');
        $('#rifInput').trigger('input');
    });

    // SENIAT: al salir del campo, si el admin activó la consulta, trae la
    // razón social real y la rellena (solo si el nombre está vacío: jamás
    // pisa lo que el operador escribió). Si no hay datos: UNA alerta simple.
    $('#rifInput').on('blur', function () {
        var rif = ($(this).val() || '').toUpperCase().replace(/[.\- ]/g, '');
        if (!rif) return;
        $.getJSON('/customer/seniat-lookup', { rif: rif }, function (r) {
            if (!r || !r.enabled) return; // consulta apagada en Ajustes Fiscales: silencio
            if (r.found) {
                if (!$('input[name=customer_name]').val()) {
                    $('input[name=customer_name]').val(r.name);
                    $('#rifHelp').text('✓ Datos del SENIAT: ' + (r.condicion || r.name));
                }
            } else {
                toastr.warning(r.error || 'No se encontraron datos fiscales en la web del SENIAT');
            }
        }).fail(function () {
            toastr.warning('No se encontraron datos fiscales en la web del SENIAT (puede ser por fallas de conexión)');
        });
    });
    $('#customerForm').on('submit', function (e) {
        var r = validateRIFLive($('#rifInput').val());
        if (!r.ok) { e.preventDefault(); toastr.error(r.msg); return false; }
    });
});
</script>
<script>
$(function () {
    $('#customerForm').on('submit', function (e) {
        e.preventDefault();
        var btn = $(this).find('button[type=submit]').prop('disabled', true);
        $.post('/customer/save', $(this).serialize(), function (r) {
            if (r.status == 1) {
                toastr.success(r.msg);
                setTimeout(function () { location.href = '/customer/list'; }, 700);
            } else {
                toastr.error(r.error || 'Error');
                btn.prop('disabled', false);
            }
        }).fail(function (x) {
            toastr.error(x.responseJSON ? x.responseJSON.error : 'Error');
            btn.prop('disabled', false);
        });
    });
});
</script>
{{end}}
