{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>{{.Title}}</h4></div>
    </div>
    <div class="panel-body">
        <form class="form-inline" id="repFilter" style="margin-bottom:15px">
            <div class="form-group">
                <label>Mes </label>
                <select class="form-control" id="month">
                    <option value="1" {{if eq .Month "1"}}selected{{end}}>Enero</option>
                    <option value="2" {{if eq .Month "2"}}selected{{end}}>Febrero</option>
                    <option value="3" {{if eq .Month "3"}}selected{{end}}>Marzo</option>
                    <option value="4" {{if eq .Month "4"}}selected{{end}}>Abril</option>
                    <option value="5" {{if eq .Month "5"}}selected{{end}}>Mayo</option>
                    <option value="6" {{if eq .Month "6"}}selected{{end}}>Junio</option>
                    <option value="7" {{if eq .Month "7"}}selected{{end}}>Julio</option>
                    <option value="8" {{if eq .Month "8"}}selected{{end}}>Agosto</option>
                    <option value="9" {{if eq .Month "9"}}selected{{end}}>Septiembre</option>
                    <option value="10" {{if eq .Month "10"}}selected{{end}}>Octubre</option>
                    <option value="11" {{if eq .Month "11"}}selected{{end}}>Noviembre</option>
                    <option value="12" {{if eq .Month "12"}}selected{{end}}>Diciembre</option>
                </select>
            </div>
            <div class="form-group" style="margin-left:5px">
                <label>Año </label>
                <input type="number" class="form-control" id="year" value="{{.Year}}" style="width:80px">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-left:5px"><i class="fa fa-search"></i> Consultar</button>
            <button type="button" class="btn btn-default" id="btnPrint"><i class="fa fa-print"></i> Imprimir</button>
        </form>

        <div class="print-area">
        <table class="table table-striped table-bordered" id="repTable" width="100%">
            <thead>
                <tr>
                    <th>Código</th><th>Producto</th><th>Modelo</th><th>Unidad</th>
                    <th class="text-right">Entradas</th><th class="text-right">Salidas</th>
                    <th class="text-right">Ajustes</th><th class="text-right">Saldo</th>
                    <th class="text-right">Costo Prom.</th>
                </tr>
            </thead>
        </table>
        </div>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    $('#repFilter').on('submit', function (e) { e.preventDefault(); load(); });
    $('#btnPrint').on('click', function () {
        window.open('/reports/inventory-control/print', '_blank');
    });
    load();
});
function load() {
    $.getJSON('/reports/inventory-control/data', function (d) {
        var rows = d.map(function (r) {
            return [r.product_id, r.name, r.model, r.unit,
                parseFloat(r.entries).toFixed(2), parseFloat(r.exits).toFixed(2),
                parseFloat(r.adjustments).toFixed(2), parseFloat(r.stock).toFixed(2),
                parseFloat(r.avg_cost).toFixed(2)];
        });
        $('#repTable').DataTable({
            destroy: true, data: rows,
            columns: [{}, {}, {}, {}, { className: 'text-right' }, { className: 'text-right' },
                { className: 'text-right' }, { className: 'text-right' }, { className: 'text-right' }],
            order: [[1, 'asc']]
        });
    });
}
</script>
{{end}}
