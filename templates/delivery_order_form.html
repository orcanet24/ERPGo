{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title">
            <h4>{{.Title}}
                <a href="/delivery_order/list" class="btn btn-default btn-sm pull-right"><i class="fa fa-arrow-left"></i> Volver</a>
            </h4>
        </div>
    </div>
    <div class="panel-body">
        <form method="POST" action="/delivery_order/save" id="deliveryOrderForm">
            <div class="row">
                <div class="col-sm-3">
                    <div class="form-group">
                        <label>Factura (Opcional)</label>
                        <input type="number" class="form-control" name="invoice_id" placeholder="ID de factura">
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <label>Cliente <span class="text-danger">*</span></label>
                        <select class="form-control" name="customer_id" required>
                            <option value="">Seleccione cliente...</option>
                            {{range .Customers}}
                            <option value="{{.id}}">{{.name}}</option>
                            {{end}}
                        </select>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <label>Almacén / Bodega</label>
                        <input type="text" class="form-control" name="warehouse_id" placeholder="WH-MAIN" value="WH-MAIN">
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <label>Estado</label>
                        <select class="form-control" name="status">
                            <option value="draft" selected>Borrador</option>
                            <option value="confirmed">Confirmada</option>
                            <option value="picking">En Picking</option>
                            <option value="packed">Empacada</option>
                            <option value="shipped">Despachada</option>
                            <option value="delivered">Entregada</option>
                            <option value="cancelled">Cancelada</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-3">
                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" class="form-control" name="date" value="{{today}}" required>
                    </div>
                </div>
                <div class="col-sm-9">
                    <div class="form-group">
                        <label>Notas</label>
                        <textarea class="form-control" name="notes" rows="2" placeholder="Notas adicionales..."></textarea>
                    </div>
                </div>
            </div>

            <hr>
            <h4>Productos de la Orden</h4>

            <div class="row" style="margin-bottom:15px">
                <div class="col-sm-12">
                    <div class="input-group">
                        <input type="text" class="form-control" id="productSearch" placeholder="Buscar producto por nombre o modelo...">
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-primary" id="addSelectedProduct"><i class="fa fa-plus"></i> Agregar</button>
                        </span>
                    </div>
                    <div id="productResults" class="list-group" style="position:absolute;z-index:1000;width:100%;max-height:300px;overflow-y:auto;display:none"></div>
                </div>
            </div>

            <table class="table table-bordered table-hover" id="deliveryOrderTable">
                <thead>
                    <tr class="bg-primary">
                        <th style="width:5%">#</th>
                        <th style="width:35%">Producto</th>
                        <th style="width:15%">Cantidad</th>
                        <th style="width:15%">Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="4" class="text-center text-muted" id="emptyMsg">No hay productos. Busque y agregue productos arriba.</td></tr>
                </tbody>
            </table>

            <hr>
            <div class="text-right">
                <a href="/delivery_order/list" class="btn btn-default">Cancelar</a>
                <button type="submit" class="btn btn-success btn-lg"><i class="fa fa-save"></i> Guardar Orden</button>
            </div>
        </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
var selectedProducts = [];
var rowIndex = 0;

// Product search
$('#productSearch').on('input', function () {
    var term = $(this).val().trim();
    if (term.length < 2) { $('#productResults').hide(); return; }
    $.get('/product/autocomplete', { term: term }, function (data) {
        var html = '';
        $.each(data, function (i, p) {
            var label = p.name + ' (' + p.model + ') - Stock: ' + p.stock;
            html += '<a href="#" class="list-group-item product-result" data-id="' + p.product_id + '" data-name="' + p.name + '" data-model="' + p.model + '" data-stock="' + p.stock + '">' + label + '</a>';
        });
        $('#productResults').html(html).show();
    });
});

// Select product from results
$(document).on('click', '.product-result', function (e) {
    e.preventDefault();
    var id = $(this).data('id');
    if (selectedProducts.indexOf(id) !== -1) {
        toastr.warning('El producto ya está en la lista');
        $('#productResults').hide();
        return;
    }
    selectedProducts.push(id);
    var name = $(this).data('name') + ' (' + $(this).data('model') + ')';
    var stock = $(this).data('stock');
    addProductRow(id, name, stock);
    $('#productResults').hide();
    $('#productSearch').val('');
});

// Add product row to table
function addProductRow(id, name, stock) {
    rowIndex++;
    $('#emptyMsg').closest('tr').remove();
    var html = '<tr data-index="' + rowIndex + '">' +
        '<td>' + rowIndex + '</td>' +
        '<td><strong>' + name + '</strong><br><small class="text-muted">Stock actual: ' + stock + '</small></td>' +
        '<td><input type="number" class="form-control input-sm do-qty" name="quantity" step="0.01" min="0.01" value="1.00" required></td>' +
        '<td><input type="hidden" name="product_id" value="' + id + '">' +
            '<button type="button" class="btn btn-danger btn-xs remove-row"><i class="fa fa-trash"></i></button></td>' +
        '</tr>';
    $('#deliveryOrderTable tbody').append(html);
}

// Remove row
$(document).on('click', '.remove-row', function () {
    var id = $(this).closest('tr').find('input[name="product_id"]').val();
    selectedProducts = selectedProducts.filter(function (v) { return v !== id; });
    $(this).closest('tr').remove();
    if ($('#deliveryOrderTable tbody tr').length === 0) {
        $('#deliveryOrderTable tbody').append('<tr><td colspan="4" class="text-center text-muted" id="emptyMsg">No hay productos. Busque y agregue productos arriba.</td></tr>');
    }
});

// Close results when clicking outside
$(document).on('click', function (e) {
    if (!$(e.target).closest('#productResults, #productSearch').length) {
        $('#productResults').hide();
    }
});

// Form validation
$('#deliveryOrderForm').on('submit', function (e) {
    if (selectedProducts.length === 0) {
        e.preventDefault();
        toastr.error('Debe agregar al menos un producto');
        return false;
    }
    var valid = true;
    $('.do-qty').each(function () {
        if (parseFloat($(this).val()) <= 0) valid = false;
    });
    if (!valid) {
        e.preventDefault();
        toastr.error('Las cantidades deben ser mayores a cero');
        return false;
    }
});
</script>
{{end}}
