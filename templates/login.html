<!DOCTYPE html>
<html lang="es" data-theme="{{.Theme}}" data-density="{{.Density}}">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Acceder - {{.AppName}}</title>
    <!-- Zoom permitido (U-10 de la auditoría): user-scalable=no impedía ampliar
         al usuario con vista cansada —la pantalla más importante del día. -->
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="/static/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
    <link href="/static/css/custom.min.css" rel="stylesheet" type="text/css" />
    <link href="/static/css/style.css" rel="stylesheet" type="text/css" />
    <link href="/static/css/erpgow-tema.css" rel="stylesheet" type="text/css" />
</head>
<body class="hold-transition login-page">
<div class="login-box">
    <div class="login-logo auth-logo">
        <a href="/"><b>{{.AppName}}</b></a>
    </div>
    <div class="login-box-body auth-box">
        <p class="login-box-msg auth-msg">Inicie sesión para continuar</p>
        {{if .Error}}
        <div class="alert alert-danger alert-dismissible">
            <button type="button" class="close" data-dismiss="alert" aria-hidden="true">&times;</button>
            {{.Error}}
        </div>
        {{end}}
        <form action="/login" method="post">
            {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
            <div class="form-group has-feedback">
                <label class="sr-only" for="login-username">Usuario</label>
                <input type="text" class="form-control" id="login-username" placeholder="Usuario" name="username" autocomplete="username" required autofocus>
                <span class="fa fa-user form-control-feedback"></span>
            </div>
            <div class="form-group has-feedback">
                <label class="sr-only" for="login-password">Contraseña</label>
                <input type="password" class="form-control" id="login-password" placeholder="Contraseña" name="password" autocomplete="current-password" required>
                <span class="fa fa-lock form-control-feedback"></span>
            </div>
            <div class="row">
                <div class="col-xs-12">
                    <button type="submit" class="btn btn-primary btn-block btn-flat erp-btn-block">Entrar</button>
                </div>
            </div>
        </form>
        <div class="appearance-choice auth-choice" data-appearance-choice="theme">
            <button type="button" class="auth-switch" data-appearance-value="light" title="Tema claro" aria-label="Tema claro"><i class="fa fa-sun-o"></i></button>
            <button type="button" class="auth-switch" data-appearance-value="dark" title="Tema oscuro" aria-label="Tema oscuro"><i class="fa fa-moon-o"></i></button>
            <button type="button" class="auth-switch" data-appearance-value="auto" title="Seguir al sistema" aria-label="Seguir al sistema"><i class="fa fa-desktop"></i></button>
        </div>
    </div>
</div>
<div class="erp-page-footer">
    ERPGo &copy; <strong>Orcanet1724 C.A</strong> &mdash; Uso libre para el comercio venezolano
</div>
<script src="/static/js/jquery-3.4.1.min.js"></script>
<script src="/static/js/bootstrap.min.js"></script>
<script src="/static/js/appearance.js"></script>
</body>
</html>
