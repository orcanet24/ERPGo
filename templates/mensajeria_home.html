{{define "content"}}
<div class="row">
    <div class="col-md-4">
        <div class="panel panel-bd">
            <div class="panel-heading">
                <div class="panel-title"><h4>Conversaciones</h4></div>
            </div>
            <div class="panel-body" style="padding:0;max-height:520px;overflow-y:auto">
                <div id="listaConversaciones" class="list-group">
                    <div class="list-group-item text-muted">Cargando…</div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="panel panel-bd">
            <div class="panel-heading">
                <div class="panel-title"><h4 id="chatTitulo">Elija una conversación</h4></div>
            </div>
            <div class="panel-body" id="hilo" style="height:420px;overflow-y:auto;background:#f7f7f7">
                <p class="text-muted text-center" id="hiloVacio">No hay conversación seleccionada.</p>
            </div>
            <div class="panel-footer">
                <form id="formEnviar" class="form-inline" style="display:none;width:100%">
                    <input type="hidden" id="env_device">
                    <input type="hidden" id="env_jid">
                    <input type="file" id="env_archivo" style="display:none"
                           accept="image/*,audio/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt">
                    <button type="button" class="btn btn-default" id="btnAdjuntar" title="Adjuntar archivo">📎</button>
                    <input type="text" class="form-control" id="env_texto"
                           placeholder="Escriba un mensaje…" autocomplete="off" style="width:72%">
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
                <div id="chatMsg" class="alert" style="display:none;margin-top:8px"></div>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
// JavaScript nativo. La bandeja lee del historial del ERP (no del daemon) y
// envía por la cola. Sondeo cada 5 s: suficiente para conversar y mucho más
// simple que montar SSE en esta fase.
(function () {
    var chatActivo = null; // {device, jid}

    function csrfToken() {
        var m = document.cookie.match(/(?:^|;\s*)erpgo_csrf=([^;]+)/);
        return m ? decodeURIComponent(m[1]) : '';
    }

    function aviso(texto, ok) {
        var caja = document.getElementById('chatMsg');
        caja.className = 'alert ' + (ok ? 'alert-success' : 'alert-danger');
        caja.textContent = texto;
        caja.style.display = 'block';
        if (ok) { window.setTimeout(function () { caja.style.display = 'none'; }, 3000); }
    }

    async function pedir(url) {
        var res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        var json = {};
        try { json = await res.json(); } catch (e) { /* sin JSON */ }
        if (!res.ok) { throw new Error(json.error || ('Error HTTP ' + res.status)); }
        return json;
    }

    async function enviar(url, datos) {
        var res = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                'X-CSRF-Token': csrfToken()
            },
            body: new URLSearchParams(datos)
        });
        var json = {};
        try { json = await res.json(); } catch (e) { /* sin JSON */ }
        if (!res.ok) { throw new Error(json.error || ('Error HTTP ' + res.status)); }
        return json;
    }

    function textoDeConversacion(c) {
        var cuerpo = c.ultimo || '';
        if (c.media === 'image') { cuerpo = '📷 ' + cuerpo; }
        if (c.media === 'audio') { cuerpo = '🎙 ' + cuerpo; }
        if (c.media === 'video') { cuerpo = '🎬 ' + cuerpo; }
        if (c.media === 'document') { cuerpo = '📄 ' + cuerpo; }
        return cuerpo || '(sin texto)';
    }

    function pintarConversaciones(lista) {
        var caja = document.getElementById('listaConversaciones');
        caja.textContent = '';
        if (!lista.length) {
            var vacio = document.createElement('div');
            vacio.className = 'list-group-item text-muted';
            vacio.textContent = 'No hay conversaciones. Si no ve ninguna, revise que tenga un dispositivo asignado.';
            caja.appendChild(vacio);
            return;
        }
        lista.forEach(function (c) {
            var boton = document.createElement('button');
            boton.type = 'button';
            boton.className = 'list-group-item';
            if (chatActivo && chatActivo.device === c.device_id && chatActivo.jid === c.jid) {
                boton.className += ' active';
            }
            var titulo = document.createElement('strong');
            titulo.textContent = c.jid.split('@')[0];
            var cuando = document.createElement('small');
            cuando.className = 'pull-right text-muted';
            cuando.textContent = (c.cuando || '').substring(11, 16);
            var ultimo = document.createElement('div');
            ultimo.className = 'text-muted';
            ultimo.style.whiteSpace = 'nowrap';
            ultimo.style.overflow = 'hidden';
            ultimo.style.textOverflow = 'ellipsis';
            ultimo.textContent = (c.direccion === 'out' ? 'Tú: ' : '') + textoDeConversacion(c);
            boton.appendChild(cuando);
            boton.appendChild(titulo);
            boton.appendChild(ultimo);
            boton.addEventListener('click', function () { abrirChat(c.device_id, c.jid); });
            caja.appendChild(boton);
        });
    }

    async function cargarConversaciones() {
        try {
            var r = await pedir('/mensajeria/conversaciones');
            pintarConversaciones(r.conversaciones || []);
        } catch (err) {
            // Un fallo de sondeo no debe llenar la pantalla de errores.
        }
    }

    function abrirChat(device, jid) {
        chatActivo = { device: device, jid: jid };
        document.getElementById('chatTitulo').textContent = jid.split('@')[0] + ' · ' + device;
        document.getElementById('env_device').value = device;
        document.getElementById('env_jid').value = jid;
        document.getElementById('formEnviar').style.display = 'flex';
        document.getElementById('hiloVacio').style.display = 'none';
        cargarMensajes(true);
        cargarConversaciones();
    }

    function pintarMensajes(mensajes, bajar) {
        var hilo = document.getElementById('hilo');
        var cercaDelFinal = hilo.scrollHeight - hilo.scrollTop - hilo.clientHeight < 80;
        hilo.textContent = '';
        if (!mensajes.length) {
            var vacio = document.createElement('p');
            vacio.className = 'text-muted text-center';
            vacio.textContent = 'Sin mensajes en esta conversación.';
            hilo.appendChild(vacio);
            return;
        }
        mensajes.forEach(function (m) {
            var fila = document.createElement('div');
            fila.style.margin = '4px 0';
            fila.style.textAlign = m.direction === 'out' ? 'right' : 'left';

            var burbuja = document.createElement('span');
            burbuja.style.display = 'inline-block';
            burbuja.style.maxWidth = '75%';
            burbuja.style.padding = '6px 10px';
            burbuja.style.borderRadius = '8px';
            burbuja.style.whiteSpace = 'pre-wrap';
            burbuja.style.background = m.direction === 'out' ? '#dcf8c6' : '#ffffff';
            burbuja.style.border = '1px solid #e3e3e3';

            var cuerpo = m.body || '';
            if (!cuerpo && m.media_type) { cuerpo = '[' + m.media_type + ']'; }

            // El archivo se sirve por una ruta autenticada del ERP, no por una
            // URL del daemon. Si no se pudo descargar, queda el tipo entre
            // corchetes en vez de un enlace roto.
            if (m.has_media) {
                var src = '/mensajeria/media/' + m.id;
                var media;
                if (m.media_type === 'image') {
                    media = document.createElement('img');
                    media.src = src;
                    media.alt = 'Imagen';
                    media.style.maxWidth = '240px';
                    media.style.display = 'block';
                    media.style.marginBottom = '4px';
                } else if (m.media_type === 'audio') {
                    media = document.createElement('audio');
                    media.controls = true;
                    media.src = src;
                    media.style.display = 'block';
                } else if (m.media_type === 'video') {
                    media = document.createElement('video');
                    media.controls = true;
                    media.src = src;
                    media.style.maxWidth = '240px';
                    media.style.display = 'block';
                } else {
                    media = document.createElement('a');
                    media.href = src;
                    media.target = '_blank';
                    media.textContent = '📄 Abrir documento';
                    media.style.display = 'block';
                }
                burbuja.appendChild(media);
            }
            if (cuerpo) {
                var texto = document.createElement('span');
                texto.textContent = cuerpo;
                burbuja.appendChild(texto);
            }

            var pie = document.createElement('div');
            pie.style.fontSize = '11px';
            pie.style.color = '#888';
            pie.textContent = (m.created_at || '').substring(11, 16) +
                (m.direction === 'out' ? ' · ' + (m.status || '') : '');

            fila.appendChild(burbuja);
            fila.appendChild(pie);
            hilo.appendChild(fila);
        });
        if (bajar || cercaDelFinal) {
            hilo.scrollTop = hilo.scrollHeight;
        }
    }

    async function cargarMensajes(bajar) {
        if (!chatActivo) { return; }
        try {
            var url = '/mensajeria/chat/' + encodeURIComponent(chatActivo.jid) +
                '/mensajes?device=' + encodeURIComponent(chatActivo.device);
            var r = await pedir(url);
            pintarMensajes(r.mensajes || [], bajar);
        } catch (err) {
            // El sondeo no interrumpe la escritura.
        }
    }

    document.getElementById('formEnviar').addEventListener('submit', async function (e) {
        e.preventDefault();
        var texto = document.getElementById('env_texto').value.trim();
        if (!texto || !chatActivo) { return; }
        var boton = e.target.querySelector('button[type=submit]');
        boton.disabled = true;
        try {
            var r = await enviar('/mensajeria/enviar', {
                device_id: chatActivo.device,
                jid: chatActivo.jid,
                texto: texto
            });
            document.getElementById('env_texto').value = '';
            aviso(r.msg || 'Mensaje en cola.', true);
            await cargarMensajes(true);
        } catch (err) {
            aviso(err.message, false);
        } finally {
            boton.disabled = false;
        }
    });

    document.getElementById('env_texto').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            document.getElementById('formEnviar').requestSubmit();
        }
    });

    document.getElementById('btnAdjuntar').addEventListener('click', function () {
        document.getElementById('env_archivo').click();
    });

    document.getElementById('env_archivo').addEventListener('change', async function () {
        var input = this;
        if (!input.files.length || !chatActivo) { return; }
        var datos = new FormData();
        datos.append('device_id', chatActivo.device);
        datos.append('jid', chatActivo.jid);
        datos.append('texto', document.getElementById('env_texto').value.trim());
        datos.append('archivo', input.files[0]);
        try {
            var res = await fetch('/mensajeria/adjuntar', {
                method: 'POST',
                headers: { 'X-CSRF-Token': csrfToken() },
                body: datos
            });
            var r = {};
            try { r = await res.json(); } catch (e) { /* sin JSON */ }
            if (!res.ok) { throw new Error(r.error || ('Error HTTP ' + res.status)); }
            input.value = '';
            document.getElementById('env_texto').value = '';
            aviso(r.msg || 'Archivo en cola.', true);
            await cargarMensajes(true);
        } catch (err) {
            aviso(err.message, false);
            input.value = '';
        }
    });

    cargarConversaciones();
    window.setInterval(cargarConversaciones, 10000);
    window.setInterval(function () { if (chatActivo) { cargarMensajes(false); } }, 5000);
})();
</script>
{{end}}
