{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>{{.Title}}</h4></div>
    </div>
    <div class="panel-body">
        <a href="/debitnote/new" class="btn btn-primary" style="margin-bottom:12px"><i class="fa fa-plus"></i> Nueva Nota de Débito</a>
        <table class="table table-bordered table-striped" id="dnTable" style="width:100%">
            <thead>
                <tr>
                    <th>Nº Nota</th><th>Control Fiscal</th><th>Fecha</th><th>Factura</th>
                    <th>Cliente</th><th>RIF</th><th class="text-right">Total</th><th class="text-right">IVA</th>
                    <th>Motivo</th><th></th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    $('#dnTable').DataTable({
        processing: true, serverSide: true,
        ajax: { url: '/debitnote/list/data', type: 'GET' },
        columns: [
            { data: 'note_no' }, { data: 'control_no' }, { data: 'date' },
            { data: 'invoice', render: function (d) { return d ? '<a href="/invoice/details/' + d + '">#' + d + '</a>' : '—'; } },
            { data: 'customer' }, { data: 'rif' },
            { data: 'total', className: 'text-right' }, { data: 'vat', className: 'text-right' },
            { data: 'reason' },
            { data: 'id', orderable: false, render: function (d) { return '<a href="/debitnote/print/' + d + '" target="_blank" class="btn btn-xs btn-default"><i class="fa fa-print"></i></a>'; } }
        ],
        order: [[2, 'desc']]
    });
});
</script>
{{end}}
