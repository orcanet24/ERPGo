{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title">
            <h4>{{.Title}}</h4>
        </div>
    </div>
    <div class="panel-body">
        <form id="voucherForm" method="post" action="/account/voucher/save">
            <input type="hidden" name="Vtype" value="{{.VType}}">
            <div class="row">
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" class="form-control" name="VDate" value="{{today}}" required>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Tipo</label>
                        <select class="form-control" id="vtypeSelect" name="VtypeSelect">
                            <option value="JV" {{if eq .VType "JV"}}selected{{end}}>Diario (JV)</option>
                            <option value="DV" {{if eq .VType "DV"}}selected{{end}}>Débito (DV)</option>
                            <option value="CV" {{if eq .VType "CV"}}selected{{end}}>Crédito (CV)</option>
                            <option value="CONTRA" {{if eq .VType "CONTRA"}}selected{{end}}>Contra</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Referencia</label>
                        <input type="text" class="form-control" name="referenceNo" placeholder="Opcional">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Narración</label>
                        <input type="text" class="form-control" name="Narration" placeholder="Descripción del comprobante">
                    </div>
                </div>
            </div>

            <table class="table table-striped table-bordered" id="rowsTable">
                <thead>
                    <tr>
                        <th style="width:5%">#</th>
                        <th style="width:30%">Cuenta Contable</th>
                        <th style="width:12%">Contrapartida</th>
                        <th style="text-right" style="width:15%">Débito</th>
                        <th style="text-right" style="width:15%">Crédito</th>
                        <th style="width:15%">Observación</th>
                        <th style="width:8%"></th>
                    </tr>
                </thead>
                <tbody id="vrows">
                </tbody>
                <tfoot>
                    <tr class="info">
                        <th colspan="4" class="text-right">TOTALES</th>
                        <th class="text-right" id="sumDebit">0.00</th>
                        <th class="text-right" id="sumCredit">0.00</th>
                        <th></th>
                    </tr>
                </tfoot>
            </table>

            <div class="row">
                <div class="col-md-8">
                    <button type="button" class="btn btn-success btn-sm" id="addRow">
                        <i class="fa fa-plus"></i> Añadir Línea
                    </button>
                    <span id="balanceMsg" style="margin-left:15px;"></span>
                </div>
                <div class="col-md-4 text-right">
                    <button type="submit" name="action" value="save" class="btn btn-primary">Guardar</button>
            <button type="submit" name="action" value="save_exit" class="btn btn-default">Guardar y Salir</button>
            </div>
            </div>
        </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
var heads = [];
$.getJSON('/account/heads', function (d) { heads = d; });
var rowIdx = 0;

function headOptions(name, sel) {
    var h = '<select class="form-control input-sm headsel" name="' + name + '" required><option value="">-- Cuenta --</option>';
    heads.forEach(function (x) {
        h += '<option value="' + x.id + '"' + (sel == x.id ? ' selected' : '') + '>' + x.id + ' - ' + x.name + ' (' + x.type + ')</option>';
    });
    return h + '</select>';
}

function addVRow(debit, credit, coaid, revcode, remark) {
    var i = rowIdx++;
    debit = debit || '';
    credit = credit || '';
    coaid = coaid || '';
    revcode = revcode || '';
    remark = remark || '';

    var sel1 = headOptions('COAID', coaid);
    var sel2 = headOptions('RevCodde', revcode);

    var rowHtml = 
        '<tr>' +
        '<td><span class="row-num">' + ($('#vrows tr').length + 1) + '</span></td>' +
        '<td>' + sel1 + '</td>' +
        '<td>' + sel2 + '</td>' +
        '<td><input type="number" step="0.01" min="0" class="form-control input-sm text-right amt-debit" name="Debit" value="' + debit + '" placeholder="0.00"></td>' +
        '<td><input type="number" step="0.01" min="0" class="form-control input-sm text-right amt-credit" name="Credit" value="' + credit + '" placeholder="0.00"></td>' +
        '<td><input type="text" class="form-control input-sm" name="remark" value="' + remark + '" placeholder="Obs."></td>' +
        '<td><button type="button" class="btn btn-danger btn-xs del-row" title="Eliminar línea"><i class="fa fa-times"></i></button></td>' +
        '</tr>';

    $('#vrows').append(rowHtml);
    renumber();
    recalc();
}

function renumber() {
    $('#vrows tr').each(function (idx) {
        $(this).find('.row-num').text(idx + 1);
    });
}

function recalc() {
    var sd = 0, sc = 0;
    $('#vrows .amt-debit').each(function () { sd += parseFloat($(this).val()) || 0; });
    $('#vrows .amt-credit').each(function () { sc += parseFloat($(this).val()) || 0; });
    $('#sumDebit').text(sd.toFixed(2));
    $('#sumCredit').text(sc.toFixed(2));

    var diff = sd - sc;
    if (Math.abs(diff) < 0.005 && sd > 0) {
        $('#balanceMsg').html('<span class="label label-success" style="font-size:14px;"><i class="fa fa-check"></i> Cuadrado</span>');
    } else {
        $('#balanceMsg').html('<span class="label label-danger" style="font-size:14px;"><i class="fa fa-exclamation"></i> Descuadre: ' + diff.toFixed(2) + '</span>');
    }
}

function isBalanced() {
    var sd = 0, sc = 0;
    $('#vrows .amt-debit').each(function () { sd += parseFloat($(this).val()) || 0; });
    $('#vrows .amt-credit').each(function () { sc += parseFloat($(this).val()) || 0; });
    return Math.abs(sd - sc) < 0.005 && sd > 0;
}

function hasMinRows() {
    return $('#vrows tr').length >= 2;
}

function hasAccounts() {
    var valid = true;
    $('#vrows tr').each(function () {
        if ($(this).find('select[name="COAID"]').val() === '') valid = false;
    });
    return valid;
}

$(function () {
    var submittedAction = 'save';

    $('button[type=submit]', '#voucherForm').on('click', function () { submittedAction = $(this).val(); });

    // Start with 4 empty rows
    addVRow(); addVRow(); addVRow(); addVRow();

    // Wait for heads to load then re-render selects
    var checkHeads = setInterval(function () {
        if (heads.length > 0) {
            clearInterval(checkHeads);
            $('#vrows tr').each(function () {
                var sel1 = $(this).find('select[name="COAID"]');
                var sel2 = $(this).find('select[name="RevCodde"]');
                var v1 = sel1.val();
                var v2 = sel2.val();
                sel1.replaceWith(headOptions('COAID', v1));
                sel2.replaceWith(headOptions('RevCodde', v2));
            });
        }
    }, 200);

    $('#addRow').on('click', function () { addVRow(); });

    $('#vrows').on('click', '.del-row', function () {
        if ($('#vrows tr').length <= 2) {
            toastr.warning('El comprobante debe tener al menos 2 líneas');
            return;
        }
        $(this).closest('tr').remove();
        renumber();
        recalc();
    });

    $('#vrows').on('input change', '.amt-debit, .amt-credit', recalc);

    $('#vtypeSelect').on('change', function () {
        var t = $(this).val();
        window.location.href = '/account/voucher/new-multi?type=' + t;
    });

    $('#voucherForm').on('submit', function (e) {
        e.preventDefault();

        if (!hasMinRows()) {
            toastr.error('El comprobante requiere al menos 2 líneas');
            return;
        }
        if (!hasAccounts()) {
            toastr.error('Todas las líneas deben tener una cuenta contable');
            return;
        }
        if (!isBalanced()) {
            toastr.error('El débito y crédito no cuadran');
            return;
        }

        var formData = $(this).serialize();
        $.post('/account/voucher/save', formData, function (r) {
            if (r.status == 1) {
                toastr.success(r.msg + ' (' + r.vno + ')');
                if (submittedAction === 'save_exit') setTimeout(function () { location.href = '/account/vouchers'; }, 900);
            } else {
                toastr.error(r.error || 'Error al guardar');
            }
        }).fail(function (x) {
            toastr.error(x.responseJSON ? x.responseJSON.error : 'Error de conexión');
        });
    });
});
</script>
{{end}}
