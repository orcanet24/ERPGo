{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title">
            <h4>Listas de Precio
                <button class="btn btn-primary btn-sm pull-right" id="addPriceList"><i class="fa fa-plus"></i> Nueva Lista</button>
            </h4>
        </div>
    </div>
    <div class="panel-body">
        <table class="table table-striped table-bordered" id="priceListTable" width="100%">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Moneda</th>
                    <th class="text-center">Orden</th>
                    <th class="text-center">Por Defecto</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>

<!-- Modal para crear/editar lista -->
<div class="modal fade" id="priceListModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Lista de Precio</h4>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <form id="priceListForm">
                <div class="modal-body">
                    <input type="hidden" name="id" id="pl_id">
                    <div class="form-group">
                        <label>Código *</label>
                        <input type="text" name="code" id="pl_code" class="form-control" placeholder="Ej: DETAL, MAYOR" required>
                    </div>
                    <div class="form-group">
                        <label>Nombre *</label>
                        <input type="text" name="name" id="pl_name" class="form-control" placeholder="Ej: Precio Detalle" required>
                    </div>
                    <div class="form-group">
                        <label>Moneda</label>
                        <input type="text" name="currency_code" id="pl_currency" class="form-control" value="VES" maxlength="3">
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Orden</label>
                                <input type="number" name="sort_order" id="pl_sort" class="form-control" value="0">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Estado</label>
                                <select name="status" id="pl_status" class="form-control">
                                    <option value="active">Activo</option>
                                    <option value="inactive">Inactivo</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label><input type="checkbox" name="is_default" id="pl_isdefault" value="1"> Lista por defecto</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    var table = $('#priceListTable').DataTable({
        processing: true,
        serverSide: true,
        pageLength: 25,
        ajax: { url: '/price_list/data', type: 'POST' },
        columns: [
            { data: 'code' },
            { data: 'name' },
            { data: 'currency_code' },
            { data: 'sort_order', className: 'text-center' },
            { data: 'is_default', className: 'text-center', render: function (d) {
                return d == 1 ? '<span class="label label-success">Sí</span>' : '<span class="label label-default">No</span>';
            }},
            { data: 'status' },
            { data: null, orderable: false, searchable: false, render: function (d) {
                return '<button class="btn btn-warning btn-xs btn-edit" data-id="' + d.id + '" title="Editar"><i class="fa fa-pencil"></i></button> ' +
                    '<button class="btn btn-success btn-xs btn-activate" data-id="' + d.id + '" title="Activar como defecto"><i class="fa fa-star"></i></button> ' +
                    '<button class="btn btn-danger btn-xs btn-delete" data-id="' + d.id + '" title="Eliminar"><i class="fa fa-trash"></i></button>';
            }}
        ]
    });

    $('#addPriceList').on('click', function () {
        $('#priceListForm')[0].reset();
        $('#pl_id').val('');
        $('#priceListModal').modal('show');
    });

    $('#priceListTable').on('click', '.btn-edit', function () {
        var row = table.row($(this).closest('tr')).data();
        $('#pl_id').val(row.id);
        $('#pl_code').val(row.code);
        $('#pl_name').val(row.name);
        $('#pl_currency').val(row.currency_code);
        $('#pl_sort').val(row.sort_order);
        $('#pl_status').val(row.status);
        $('#pl_isdefault').prop('checked', row.is_default == 1);
        $('#priceListModal').modal('show');
    });

    $('#priceListForm').on('submit', function (e) {
        e.preventDefault();
        $.post('/price_list/save', $(this).serialize(), function (r) {
            if (r.status == 1) {
                toastr.success(r.msg);
                $('#priceListModal').modal('hide');
                table.ajax.reload();
            } else {
                toastr.error(r.error || 'Error');
            }
        }).fail(function (x) {
            toastr.error(x.responseJSON ? x.responseJSON.error : 'Error');
        });
    });

    $('#priceListTable').on('click', '.btn-activate', function () {
        var id = $(this).data('id');
        // POST: la activación cambia el estado (dos UPDATE); como GET era
        // un enlace de nivel superior con cookie adjunta (S-10, auditoría).
        $.post('/price_list/activate/' + id, function (r) {
            if (r.status == 1) { toastr.success(r.msg); table.ajax.reload(); }
            else toastr.error(r.error || 'Error');
        }).fail(function (x) {
            toastr.error(x.responseJSON ? x.responseJSON.error : 'Error');
        });
    });

    $('#priceListTable').on('click', '.btn-delete', function () {
        var id = $(this).data('id');
        swal({
            title: "¿Eliminar lista?",
            text: "Esta acción no se puede deshacer.",
            type: "warning",
            showCancelButton: true,
            confirmButtonText: "Eliminar",
            confirmButtonColor: ERPGo.appearance.css("--erp-danger", "#9c3333"),
            closeOnConfirm: true
        }, function () {
            $.post('/price_list/delete/' + id, function (r) {
                if (r.status == 1) { toastr.success(r.msg); table.ajax.reload(); }
                else toastr.error(r.error || 'Error');
            }).fail(function (x) {
                toastr.error(x.responseJSON ? x.responseJSON.error : 'Error');
            });
        });
    });
});
</script>
{{end}}
