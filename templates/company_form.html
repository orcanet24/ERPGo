{{define "content"}}
<div class="panel panel-bd">
    <div class="panel-heading">
        <div class="panel-title"><h4>{{.Title}}</h4></div>
    </div>
    <div class="panel-body">
        <form id="companyForm" style="max-width:700px">
            <div class="form-group">
                <label>Nombre de la empresa *</label>
                <input type="text" class="form-control" name="company_name" value="{{.Company.CompanyName}}" required>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" name="email" value="{{.Company.Email}}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Teléfono / Móvil</label>
                        <input type="text" class="form-control" name="mobile" value="{{.Company.Mobile}}">
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Dirección</label>
                <textarea class="form-control" name="address" rows="2">{{.Company.Address}}</textarea>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Sitio web</label>
                        <input type="text" class="form-control" name="website" value="{{.Company.Website}}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>RIF / VAT</label>
                        <input type="text" class="form-control" name="vat_no" value="{{.Company.VatNo}}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label>Nº Registro</label>
                        <input type="text" class="form-control" name="cr_no" value="{{.Company.CrNo}}">
                    </div>
                </div>
            </div>
            <button type="submit" name="action" value="save" class="btn btn-primary">Guardar</button>
            <button type="submit" name="action" value="save_exit" class="btn btn-default">Guardar y Salir</button>
            </form>
    </div>
</div>
{{end}}

{{define "pagejs"}}
<script>
$(function () {
    $('#companyForm').on('submit', function (e) {
        e.preventDefault();
        $.post('/settings/company/save', $(this).serialize(), function (r) {
            if (r.status == 1) { toastr.success(r.msg); ERPGo.refrescar(); }
            else toastr.error(r.error);
        }).fail(function (x) { toastr.error(x.responseJSON ? x.responseJSON.error : 'Error'); });
    });
});
</script>
{{end}}
